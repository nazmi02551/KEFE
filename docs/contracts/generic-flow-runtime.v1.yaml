contract_version: 1.1.0
updated_at: '2026-07-29'
source_adrs:
  - docs/adr/0023-generic-consumer-flow-runtime.md
  - docs/adr/0025-decision-revision-exposure-intervention-delta.md
status: implementation_contract

authority:
  session: actor_owned_weigh_session
  case_version: session_pinned_case_version
  flow: case_version_resolved_flow
  decision_lineage: actor_owned_session_revision_and_exposure_state
  live_content_configuration_lookup: forbidden

http:
  method: GET
  path: /v1/weigh-sessions/{session_id}/flow
  authentication: consumer_actor_required
  actor_scope: same_actor_only
  result_payload_included: false
  perspective_payload_included: false
  private_reason_payload_included: false

snapshot:
  fields:
    - session_id
    - case_version_id
    - session_state
    - template_code
    - template_version_no
    - entry_step_code
    - execution_support
    - steps
  execution_support:
    - FULL
    - PARTIAL

step:
  states:
    - READY
    - COMPLETED
    - BLOCKED
    - UNSUPPORTED
  fields:
    - code
    - primitive_code
    - capability_codes
    - next_step_codes
    - state
    - reason_code

primitive_semantics_v2:
  CONTEXT:
    before_first_decision:
      non_blocking: true
      reachable_state: READY
      transition_satisfied_when_reachable: true
    between_decisions:
      before_actual_exposure: READY
      transition_satisfied_before_exposure: false
      after_actual_exposure: COMPLETED
      transition_satisfied_after_exposure: true
      context_fetch_alone_counts_as_exposure: false
  DECISION:
    first_decision:
      before_initial_commit: READY
      after_revision_one: COMPLETED
      historical_committed_session_without_revision: COMPLETED
      transition_satisfied_when: revision_one_exists_or_historical_session_committed
    later_decision:
      predecessors_pending: BLOCKED
      predecessors_satisfied_without_revision: READY
      committed_revision_exists_for_step: COMPLETED
      revision_capability_intrinsically_unsupported: false
  COLLECTIVE_RESULT:
    before_initial_commit: BLOCKED
    before_initial_commit_reason: FLOW_COMMIT_REQUIRED
    after_initial_commit: READY
    contains_result_payload: false
    successful_reveal_delivery_may_record_exposure: true
  REFLECTION:
    after_predecessors: UNSUPPORTED
    reason_code: FLOW_REFLECTION_RUNTIME_PENDING
  unknown:
    after_predecessors: UNSUPPORTED
    reason_code: FLOW_PRIMITIVE_UNSUPPORTED

graph:
  predecessor_source: resolved_flow_next_step_codes
  unmet_predecessor_state: BLOCKED
  unmet_predecessor_reason: FLOW_PREDECESSOR_PENDING
  client_completed_step_claims_accepted: false
  client_revision_state_claims_accepted: false
  client_exposure_state_claims_accepted: false

lineage:
  decision_completion_source: committed_decision_revision_for_flow_step
  context_completion_source: recorded_actual_context_exposure_when_exposure_required
  result_readiness_source: initial_commit_barrier
  decision_delta_payload_in_flow_runtime: false
  intervention_payload_in_flow_runtime: false

legacy:
  missing_resolved_flow:
    error_code: FLOW_RUNTIME_UNAVAILABLE
    http_status: 409
    infer_from_live_configuration: false
    assume_default_flow: false
  committed_sessions_created_before_revision_persistence:
    first_decision_treated_as_completed: true
    synthetic_revision_created_on_read: false

security:
  result_leak_before_commit: forbidden
  reveal_endpoint_remains_authoritative: true
  perspective_endpoint_remains_authoritative: true
  foreign_session_behavior: not_found
