contract_version: 1.0.0
updated_at: '2026-07-28'
source_adr: docs/adr/0018-versioned-content-configuration.md

persistence:
  schema: content_config
  version_table: content_config.configuration_version
  audit_table: content_config.configuration_audit
  aggregate_storage: jsonb
  executable_source: services/api/migrations

configuration_version:
  identity: uuid
  version_no:
    type: integer
    unique: true
    monotonic: true
  lifecycle: [DRAFT, PUBLISHED, SUPERSEDED]
  immutable_when: [PUBLISHED, SUPERSEDED]
  one_published_version: true
  cloned_from_version_id: nullable_uuid

publication:
  transaction:
    - lock target DRAFT
    - lock current PUBLISHED if present
    - supersede current PUBLISHED
    - publish target
    - append audit
  atomic: true
  rollback: clone_historical_to_new_draft

bootstrap:
  behavior: seed_default_only_when_no_configuration_exists
  stable_seed_id: 77777777-7777-4777-8777-777777777777

audit:
  append_only: true
  actor_ref: server_derived
  commands:
    - CREATE_DRAFT_FROM_CURRENT
    - SAVE_DRAFT
    - PUBLISH
    - CREATE_ROLLBACK_DRAFT

provider_boundary:
  domain_must_not_import:
    - sqlalchemy
    - psycopg
    - vendor_config_sdk
