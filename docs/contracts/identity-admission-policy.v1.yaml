policy_version: 1.0.0
generated_at: '2026-07-27'
owner: Identity / Trust / Platform Engineering
purpose: Guest credential issuance abuse-control and device-integrity policy.
entries:
- key: identity.guest_issue_rate_limit
  type: integer
  default: 10
  constraints:
    min: 1
    max: 1000
  unit: requests
  remote: false
  audit: true
- key: identity.guest_issue_rate_window_seconds
  type: integer
  default: 60
  constraints:
    min: 1
    max: 3600
  unit: seconds
  remote: false
  audit: true
- key: identity.device_integrity_mode
  type: enum
  default: OPTIONAL
  allowed:
  - 'OFF'
  - OPTIONAL
  - REQUIRED
  scope:
  - environment
  remote: false
  audit: true
release_gates:
- Public beta cannot rely on the single-process in-memory limiter; a shared/distributed limiter adapter is required.
- Public beta must bind a real platform-integrity provider adapter or explicitly approve a documented degraded mode.
- Proxy/source-address trust must be configured at the deployment edge; application code must not blindly trust arbitrary forwarded-address headers.
- Integrity evidence is opaque provider input and must not be logged or persisted unless a separately approved retention purpose exists.
non_configurable_invariants:
- Client-supplied actor identifiers never establish authenticated ownership.
- Device-integrity providers are adapters; provider-specific SDKs cannot enter Identity domain/application code.
- Failure of an optional integrity provider must not silently become VERIFIED.
