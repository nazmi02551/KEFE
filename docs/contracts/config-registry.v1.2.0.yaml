non_configurable_invariants:
- Reveal cannot expose community/expert/popular-reason results before a server-confirmed
  commit.
- Published CaseVersion is immutable; correction creates a new version.
- AI output is never represented as human or expert opinion.
- Direct PII cannot be exposed to analytics or consumer result payloads.
- Individual decision history is not sold and cannot be used for political microtargeting.
- Outbox delivery is at-least-once; consumers must be idempotent and transport choice cannot weaken domain commit atomicity.
- Protected Decision writes derive actor identity from authenticated credentials; client-supplied actor identifiers are not trusted.
