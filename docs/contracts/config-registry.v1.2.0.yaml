registry_version: 1.2.0
generated_at: '2026-07-27'
principles:
- One concept has one semantic key; consumers reference the key, not duplicated literals.
- Configuration is typed, versioned, owned, auditable and rollback-capable.
- Secrets never live in this registry.
- Domain invariants, legal/safety guardrails and consent requirements are not overridable
  by remote config.
