contract_version: 1.5.0
updated_at: '2026-08-03'
route_prefix: /internal/admin/v1
security:
  session_cookie:
    name: kefe_admin_session
    required_on: [read, write]
    transport_requirements:
      secure: true
      http_only: true
      same_site: Strict
      path: /internal/admin
  csrf:
    header: X-KEFE-CSRF
    required_on: [write]
    bound_to_same_session: true
    verify_before_mutation: true
  identity:
    source: server_resolved_admin_session
    forbidden_request_fields:
      - actor_ref
      - reviewer_ref
      - requested_by_admin_ref
      - admin_subject_id
      - roles
      - capabilities
      - state
      - lifecycle_state
  consumer_credentials_accepted: false
  admin_login_endpoint_in_scope: false
application_boundary:
  facade: SecuredContentAuthoringService
  proposal_queue_facade: SecuredProposalQueueService
  proposal_review_facade: SecuredProposalReviewService
  feed_item_materialization_facade: SecuredFeedItemMaterializationService
  feed_item_materialization_status_facade: SecuredFeedItemMaterializationStatusService
  projection_facade: SecuredEditorialProjectionService
  direct_repository_mutation_from_http: forbidden
  audit_actor_ref: server_derived
  provider_specific_identity_sdk_in_domain: forbidden
operations:
  - method: GET
    path: /session
    csrf: false
    behavior: authenticated_principal_introspection
  - method: POST
    path: /cases
    csrf: true
    capability: CONTENT_CREATE
  - method: GET
    path: /proposals
    csrf: false
    capability: CONTENT_REVIEW
    ordering: [created_at_ASC, proposal_id_ASC]
    pagination: opaque_keyset_cursor
    maximum_limit: 100
    offset_pagination: forbidden
    payload_in_list: false
  - method: GET
    path: /proposals/{proposal_id}
    csrf: false
    capability: CONTENT_REVIEW
    immutable_payload_included: true
  - method: POST
    path: /proposals/{proposal_id}/review
    csrf: true
    capability: CONTENT_REVIEW
    reviewer_identity: server_derived
    terminal_decision: true
    automatic_projection: forbidden
  - method: POST
    path: /proposals/{proposal_id}/feed-item-materialization
    csrf: true
    capabilities: [CONTENT_REVIEW, SOURCE_VERIFY]
    facade: SecuredFeedItemMaterializationService
    exact_proposal_kind: FEED_ITEM
    exact_target_kind: NORMALIZED_ARTIFACT
    exact_review_binding_required: true
    review_created_by_command: false
    idempotent_replay_status: 200
    generic_materialization: forbidden
    automatic_review_projection_publication: forbidden
  - method: GET
    path: /proposals/{proposal_id}/feed-item-materialization-status
    csrf: false
    capabilities: [CONTENT_REVIEW, SOURCE_VERIFY]
    facade: SecuredFeedItemMaterializationStatusService
    exact_proposal_kind: FEED_ITEM
    states: [REVIEW_REQUIRED, READY, MATERIALIZED]
    payload_disclosure: forbidden
    normalized_artifact_disclosure: forbidden
    evidence_disclosure: forbidden
    mutation: forbidden
  - method: POST
    path: /candidate-proposals/{candidate_proposal_id}/projection
    csrf: true
    capability: CONTENT_PROJECT
    facade: SecuredEditorialProjectionService
    actor_identity: server_derived
    creates_lifecycle_state: DRAFT
    idempotent_replay_status: 200
    automatic_review_approval_publication: forbidden
  - method: POST
    path: /case-versions/{version_id}/revisions
    csrf: true
    capability: CONTENT_EDIT
  - method: PUT
    path: /case-versions/{version_id}
    csrf: true
    capability: CONTENT_EDIT
  - method: POST
    path: /case-versions/{version_id}/submit
    csrf: true
    capability: CONTENT_SUBMIT_REVIEW
  - method: POST
    path: /case-versions/{version_id}/approve
    csrf: true
    capability: CONTENT_REVIEW
    separation_of_duties: reviewer_must_differ_from_submitter
  - method: POST
    path: /case-versions/{version_id}/reject
    csrf: true
    capability: CONTENT_REVIEW
    rationale_required: true
  - method: POST
    path: /case-versions/{version_id}/publish
    csrf: true
    capability: CONTENT_PUBLISH
    recent_step_up_required: true
  - method: POST
    path: /case-versions/{version_id}/withdraw
    csrf: true
    capability: CONTENT_WITHDRAW
    recent_step_up_required: true
    rationale_required: true
  - method: GET
    path: /cases/{case_id}/audit
    csrf: false
    capability: AUDIT_READ
errors:
  csrf_missing: ADMIN_CSRF_REQUIRED
  csrf_invalid: ADMIN_CSRF_INVALID
  authentication:
    - ADMIN_AUTH_REQUIRED
    - ADMIN_SESSION_INVALID
    - ADMIN_SESSION_EXPIRED
    - ADMIN_SESSION_REVOKED
    - ADMIN_MFA_REQUIRED
  authorization:
    - ADMIN_FORBIDDEN
    - ADMIN_STEP_UP_REQUIRED
    - ADMIN_SEPARATION_OF_DUTIES
  proposal_queue:
    - ADMIN_PROPOSAL_QUEUE_CURSOR_INVALID
    - INGESTION_PROPOSAL_NOT_FOUND
  proposal_review:
    - INGESTION_PROPOSAL_NOT_FOUND
    - INGESTION_PROPOSAL_ALREADY_REVIEWED
  feed_item_materialization:
    - INGESTION_PROPOSAL_NOT_FOUND
    - INGESTION_FEED_ITEM_MATERIALIZATION_UNSUPPORTED
    - INGESTION_PROPOSAL_REVIEW_NOT_ACCEPTED
    - INGESTION_PROPOSAL_REVIEW_BINDING_MISMATCH
    - INGESTION_FEED_ITEM_MATERIALIZATION_CONFLICT
    - INGESTION_FEED_ITEM_MATERIALIZATION_INVALID
  feed_item_materialization_status:
    - INGESTION_PROPOSAL_NOT_FOUND
    - INGESTION_FEED_ITEM_MATERIALIZATION_UNSUPPORTED
    - INGESTION_FEED_ITEM_MATERIALIZATION_STATUS_CONFLICT
  projection:
    - EDITORIAL_PROJECTION_PROFILE_NOT_FOUND
    - EDITORIAL_PROJECTION_SOURCE_NOT_FOUND
    - EDITORIAL_PROJECTION_SOURCE_NOT_ACCEPTED
    - EDITORIAL_PROJECTION_DEPENDENCY_NOT_READY
    - EDITORIAL_PROJECTION_IDEMPOTENCY_CONFLICT
    - EDITORIAL_PROJECTION_CANDIDATE_ALREADY_PROJECTED
    - EDITORIAL_PROJECTION_FLOW_REFERENCE_INVALID
    - EDITORIAL_PROJECTION_PERSISTENCE_CONFLICT
logging:
  forbidden_secret_fields:
    - session_cookie_value
    - csrf_token_value
responses:
  may_echo_session_secret: false
  may_echo_csrf_secret: false
