name: Repair Admin Case Builder candidate

on:
  pull_request:
    paths:
      - ".github/workflows/admin-case-builder-repair.yml"
      - "services/api/tools/export_admin_case_builder_openapi_overlay.py"

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'feature/admin-case-builder-draft-workspace' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-case-builder-draft-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Fix internal Next navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/admin/src/components/case-builder-workspace.tsx")
          source = path.read_text(encoding="utf-8")
          import_anchor = 'import { useMemo, useState } from "react";\n'
          link_import = 'import Link from "next/link";\n'
          if link_import not in source:
              source = source.replace(import_anchor, import_anchor + link_import, 1)
          source = source.replace(
              '<a className={styles.backLink} href="/">\n'
              '          Editoryal operasyonlara dön\n'
              '        </a>',
              '<Link className={styles.backLink} href="/">\n'
              '          Editoryal operasyonlara dön\n'
              '        </Link>',
              1,
          )
          if '<a className={styles.backLink} href="/">' in source:
              raise SystemExit("internal anchor was not replaced")
          path.write_text(source, encoding="utf-8")
          PY
      - name: Install API tooling
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Normalize generator and regenerate overlay
        working-directory: services/api
        run: |
          ruff format tools/export_admin_case_builder_openapi_overlay.py
          python tools/export_admin_case_builder_openapi_overlay.py \
            --output ../../docs/contracts/openapi-admin-case-builder.v0.19.overlay.json
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/admin-case-builder-repair.yml
      - name: Commit bounded repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/case-builder-workspace.tsx \
            services/api/tools/export_admin_case_builder_openapi_overlay.py \
            docs/contracts/openapi-admin-case-builder.v0.19.overlay.json \
            .github/workflows/admin-case-builder-repair.yml
          git diff --cached --check
          git commit -m "fix(case-builder): repair additive contract and navigation"
          git push origin HEAD:feature/admin-case-builder-draft-workspace
