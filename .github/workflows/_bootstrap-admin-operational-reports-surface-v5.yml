name: Bootstrap Admin Operational Reports Surface v5

on:
  push:
    branches:
      - feature/admin-operational-reports-snapshot
    paths:
      - services/api/tools/_admin_operational_reports_checker.template
      - services/api/tools/_admin_operational_reports_openapi.template
      - .github/workflows/_bootstrap-admin-operational-reports-surface-v5.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-operational-reports-snapshot
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        run: |
          cd services/api
          python -m pip install -q -U pip
          pip install -q -e '.[dev]'
          cd ../../apps/admin
          npm ci --no-audit --no-fund
      - name: Apply surface, restore verified Python tools and remove bootstrap machinery
        run: |
          python services/api/tools/strip_postgres_block_from_operational_reports_patcher.py
          python services/api/tools/bootstrap_admin_operational_reports_surface.py
          cp services/api/tools/_admin_operational_reports_checker.template \
            services/api/tools/check_admin_operational_reports_contract.py
          cp services/api/tools/_admin_operational_reports_openapi.template \
            services/api/tools/export_admin_operational_reports_openapi_overlay.py
          python -m py_compile \
            services/api/tools/check_admin_operational_reports_contract.py \
            services/api/tools/export_admin_operational_reports_openapi_overlay.py
          rm services/api/tools/bootstrap_admin_operational_reports_surface.py
          rm services/api/tools/fix_admin_operational_reports_surface_patcher.py
          rm services/api/tools/strip_postgres_block_from_operational_reports_patcher.py
          rm services/api/tools/fix_generated_operational_reports_python.py
          rm services/api/tools/_admin_operational_reports_checker.template
          rm services/api/tools/_admin_operational_reports_openapi.template
          rm .github/workflows/_bootstrap-admin-operational-reports-surface.yml
          rm .github/workflows/_bootstrap-admin-operational-reports-surface-v2.yml
          rm .github/workflows/_bootstrap-admin-operational-reports-surface-v3.yml
          rm .github/workflows/_bootstrap-admin-operational-reports-surface-v4.yml
          rm .github/workflows/_bootstrap-admin-operational-reports-surface-v5.yml
      - name: Normalize and lint API
        working-directory: services/api
        run: |
          ruff format \
            src/kefe_api/modules/admin_operational_reports \
            src/kefe_api/modules/admin_security/operational_reports.py \
            src/kefe_api/modules/admin_security/operational_reports_router.py \
            src/kefe_api/modules/content_authoring/ports.py \
            src/kefe_api/modules/content_authoring/in_memory.py \
            src/kefe_api/modules/ingestion_orchestration/review_queue.py \
            src/kefe_api/modules/ingestion_orchestration/ports.py \
            src/kefe_api/modules/ingestion_orchestration/in_memory.py \
            src/kefe_api/modules/community_reason/ports.py \
            src/kefe_api/modules/community_reason/in_memory.py \
            src/kefe_api/infrastructure/postgres_flow_pinned_content_authoring.py \
            src/kefe_api/infrastructure/postgres_proposal_review_queue.py \
            src/kefe_api/infrastructure/postgres_community_reason.py \
            src/kefe_api/modules/admin_security/models.py \
            src/kefe_api/modules/admin_security/policy.py \
            src/kefe_api/main.py \
            tests/test_admin_operational_reports_http.py \
            tests/test_admin_operational_reports_http_postgres.py \
            tools/check_admin_operational_reports_contract.py \
            tools/export_admin_operational_reports_openapi_overlay.py \
            tools/export_admin_community_reason_moderation_openapi_overlay.py \
            tools/export_openapi.py tools/export_mvp_openapi_overlay.py \
            tools/export_global_openapi_overlay.py
          ruff check --fix \
            src/kefe_api/modules/admin_operational_reports \
            src/kefe_api/modules/admin_security/operational_reports.py \
            src/kefe_api/modules/admin_security/operational_reports_router.py \
            src/kefe_api/modules/content_authoring/ports.py \
            src/kefe_api/modules/content_authoring/in_memory.py \
            src/kefe_api/modules/ingestion_orchestration/review_queue.py \
            src/kefe_api/modules/ingestion_orchestration/ports.py \
            src/kefe_api/modules/ingestion_orchestration/in_memory.py \
            src/kefe_api/modules/community_reason/ports.py \
            src/kefe_api/modules/community_reason/in_memory.py \
            src/kefe_api/infrastructure/postgres_flow_pinned_content_authoring.py \
            src/kefe_api/infrastructure/postgres_proposal_review_queue.py \
            src/kefe_api/infrastructure/postgres_community_reason.py \
            src/kefe_api/modules/admin_security/models.py \
            src/kefe_api/modules/admin_security/policy.py \
            src/kefe_api/main.py \
            tests/test_admin_operational_reports_http.py \
            tests/test_admin_operational_reports_http_postgres.py \
            tools/check_admin_operational_reports_contract.py \
            tools/export_admin_operational_reports_openapi_overlay.py \
            tools/export_admin_community_reason_moderation_openapi_overlay.py \
            tools/export_openapi.py tools/export_mvp_openapi_overlay.py \
            tools/export_global_openapi_overlay.py
      - name: Generate and verify exact OpenAPI composition
        working-directory: services/api
        run: |
          python tools/export_admin_operational_reports_openapi_overlay.py \
            --output ../../docs/contracts/openapi-admin-operational-reports.v0.19.overlay.json
          python tools/export_admin_operational_reports_openapi_overlay.py \
            --output ../../docs/contracts/openapi-admin-operational-reports.v0.19.overlay.json --check
          python tools/export_admin_community_reason_moderation_openapi_overlay.py \
            --output ../../docs/contracts/openapi-admin-community-reason-moderation.v0.19.overlay.json --check
          python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Verify backend contract and memory behavior
        working-directory: services/api
        run: |
          python tools/check_admin_operational_reports_contract.py
          pytest -q tests/test_admin_operational_reports_http.py \
            tests/test_admin_community_reason_moderation_http.py \
            tests/test_mvp_completion.py
      - name: Verify Admin UI contracts, lint, types, tests and build
        working-directory: apps/admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run verify
      - name: Migrate PostgreSQL and verify durable restart aggregate
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_PERSISTENCE_BACKEND: postgres
          KEFE_RUN_POSTGRES_TESTS: "1"
        run: |
          alembic upgrade head
          pytest -q tests/test_admin_operational_reports_http_postgres.py
      - name: Commit verified surface
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add read-only Admin operational reports surface"
          git push origin HEAD:feature/admin-operational-reports-snapshot
