name: Format Canonical Public Feed

on:
  pull_request:
    paths:
      - '.github/workflows/format-canonical-public-feed.yml'
      - 'services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py'
      - 'services/api/tests/test_canonical_public_feed_catalog.py'
      - 'services/api/tools/check_canonical_public_feed_catalog.py'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install -q ruff==0.11.10
      - name: Normalize
        run: |
          ruff check --fix services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py services/api/tests/test_canonical_public_feed_catalog.py services/api/tools/check_canonical_public_feed_catalog.py
          ruff format services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py services/api/tests/test_canonical_public_feed_catalog.py services/api/tools/check_canonical_public_feed_catalog.py
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py services/api/tests/test_canonical_public_feed_catalog.py services/api/tools/check_canonical_public_feed_catalog.py
          git commit -m 'style: normalize canonical public-feed sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
