name: Format Current Progressive Slice

on:
  push:
    branches:
      - feature/progressive-active-step-current-stack

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progressive-active-step-current-stack
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit normalized sources
        run: |
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test
          git commit -m "style: normalize progressive current-stack sources"
          git push origin HEAD:feature/progressive-active-step-current-stack
