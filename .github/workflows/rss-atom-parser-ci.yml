name: RSS Atom Parser CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_parser.py'
      - 'services/api/tests/test_rss_atom_parser*.py'
      - 'services/api/tools/check_rss_atom_parser_contract.py'
      - 'docs/adr/0088-strict-bounded-rss-atom-parsing-profile.md'
      - 'docs/contracts/rss-atom-parser-slice52.v1.json'
      - '.github/workflows/rss-atom-parser-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_parser.py'
      - 'services/api/tests/test_rss_atom_parser*.py'
      - 'services/api/tools/check_rss_atom_parser_contract.py'
      - 'docs/adr/0088-strict-bounded-rss-atom-parsing-profile.md'
      - 'docs/contracts/rss-atom-parser-slice52.v1.json'
      - '.github/workflows/rss-atom-parser-ci.yml'

permissions:
  contents: read

jobs:
  rss-atom-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff RSS Atom parser boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/rss_atom_parser.py
          tests/test_rss_atom_parser.py
          tests/test_rss_atom_parser_architecture.py
          tools/check_rss_atom_parser_contract.py
      - name: RSS Atom parser architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_parser_contract.py
      - name: RSS Atom parser behavior
        working-directory: services/api
        run: pytest tests/test_rss_atom_parser.py tests/test_rss_atom_parser_architecture.py
