name: Integrate Canonical Public Feed API

on:
  pull_request:
    paths:
      - '.github/workflows/integrate-canonical-public-feed-api.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire composition and API 0.24 router
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text: str, old: str, new: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing main composition fragment: {old[:120]!r}')
              return text.replace(old, new, 1)

          path = Path('services/api/src/kefe_api/main.py')
          source = path.read_text(encoding='utf-8')
          source = replace_required(
              source,
              'from kefe_api.core.settings import get_settings\n'
              'from kefe_api.infrastructure.editorial_pipeline import build_editorial_pipeline\n',
              'from kefe_api.core.settings import get_settings\n'
              'from kefe_api.infrastructure.canonical_public_feed_composition import (\n'
              '    build_canonical_public_feed_composition,\n'
              ')\n'
              'from kefe_api.infrastructure.editorial_pipeline import build_editorial_pipeline\n',
          )
          source = replace_required(
              source,
              'from kefe_api.modules.admin_security.content_authoring import '
              'SecuredContentAuthoringService\n',
              'from kefe_api.modules.admin_security.canonical_public_feed_router import (\n'
              '    router as admin_canonical_public_feed_router,\n'
              ')\n'
              'from kefe_api.modules.admin_security.content_authoring import '
              'SecuredContentAuthoringService\n',
          )
          source = replace_required(
              source,
              '    editorial_pipeline = build_editorial_pipeline(\n'
              '        settings,\n'
              '        content_authoring_repository=content_authoring_repository,\n'
              '        admin_security_service=admin_security_service,\n'
              '        raw_source_evidence_store=raw_source_evidence_store,\n'
              '    )\n'
              '    content_configuration_service = ContentConfigurationService(\n',
              '    editorial_pipeline = build_editorial_pipeline(\n'
              '        settings,\n'
              '        content_authoring_repository=content_authoring_repository,\n'
              '        admin_security_service=admin_security_service,\n'
              '        raw_source_evidence_store=raw_source_evidence_store,\n'
              '    )\n'
              '    canonical_public_feed = build_canonical_public_feed_composition(\n'
              '        settings,\n'
              '        admin_security_service=admin_security_service,\n'
              '        editorial_pipeline=editorial_pipeline,\n'
              '    )\n'
              '    content_configuration_service = ContentConfigurationService(\n',
          )
          source = replace_required(
              source,
              '    app.state.public_http_capture_adapter_factory = (\n'
              '        editorial_pipeline.public_http_capture_adapter_factory\n'
              '    )\n',
              '    app.state.public_http_capture_adapter_factory = (\n'
              '        editorial_pipeline.public_http_capture_adapter_factory\n'
              '    )\n'
              '    app.state.provider_adoption_registry = (\n'
              '        editorial_pipeline.provider_adoption_registry\n'
              '    )\n'
              '    app.state.canonical_public_feed_repository = (\n'
              '        canonical_public_feed.repository\n'
              '    )\n'
              '    app.state.canonical_public_feed_runtime_profiles = (\n'
              '        canonical_public_feed.runtime_profiles\n'
              '    )\n'
              '    app.state.canonical_public_feed_service = canonical_public_feed.service\n',
          )
          source = replace_required(
              source,
              '    if _api_at_least(settings.api_version, 0, 23):\n'
              '        app.include_router(admin_source_brief_review_router)\n'
              '    app.include_router(admin_editorial_projection_router)\n',
              '    if _api_at_least(settings.api_version, 0, 23):\n'
              '        app.include_router(admin_source_brief_review_router)\n'
              '    if _api_at_least(settings.api_version, 0, 24):\n'
              '        app.include_router(admin_canonical_public_feed_router)\n'
              '    app.include_router(admin_editorial_projection_router)\n',
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Normalize and verify
        working-directory: services/api
        run: |
          python -m pip install -q ruff==0.11.10
          ruff format src/kefe_api/main.py
          ruff check src/kefe_api/main.py
          python -m py_compile src/kefe_api/main.py
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/integrate-canonical-public-feed-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/src/kefe_api/main.py
          git commit -m 'feat: expose canonical public-feed Admin API at 0.24'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
