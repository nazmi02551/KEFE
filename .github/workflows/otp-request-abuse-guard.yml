name: OTP Request Abuse Guard CI

on:
  pull_request:
    paths:
      - "services/api/src/kefe_api/core/settings.py"
      - "services/api/src/kefe_api/infrastructure/persistence.py"
      - "services/api/src/kefe_api/infrastructure/postgres_otp_request_guard.py"
      - "services/api/src/kefe_api/modules/identity/otp_request_guard.py"
      - "services/api/migrations/versions/20260805_0031_otp_request_abuse_guard.py"
      - "services/api/tests/test_otp_request_abuse_guard.py"
      - "services/api/tests/test_otp_request_abuse_guard_postgres.py"
      - "services/api/tools/check_otp_request_abuse_guard_contract.py"
      - "docs/adr/0113-durable-otp-request-abuse-guard.md"
      - "docs/contracts/error-codes.v1.yaml"
      - "docs/contracts/otp-request-abuse-guard.v1.json"
      - "docs/status/F4_OTP_REQUEST_ABUSE_GUARD_2026-08-05.md"
      - ".github/workflows/otp-request-abuse-guard.yml"
  push:
    branches: [main]
    paths:
      - "services/api/src/kefe_api/core/settings.py"
      - "services/api/src/kefe_api/infrastructure/persistence.py"
      - "services/api/src/kefe_api/infrastructure/postgres_otp_request_guard.py"
      - "services/api/src/kefe_api/modules/identity/otp_request_guard.py"
      - "services/api/migrations/versions/20260805_0031_otp_request_abuse_guard.py"
      - "services/api/tests/test_otp_request_abuse_guard.py"
      - "services/api/tests/test_otp_request_abuse_guard_postgres.py"
      - "services/api/tools/check_otp_request_abuse_guard_contract.py"
      - "docs/adr/0113-durable-otp-request-abuse-guard.md"
      - "docs/contracts/error-codes.v1.yaml"
      - "docs/contracts/otp-request-abuse-guard.v1.json"
      - "docs/status/F4_OTP_REQUEST_ABUSE_GUARD_2026-08-05.md"
      - ".github/workflows/otp-request-abuse-guard.yml"

permissions:
  contents: read

concurrency:
  group: otp-request-abuse-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint OTP request guard slice
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/core/settings.py
          src/kefe_api/infrastructure/persistence.py
          src/kefe_api/infrastructure/postgres_otp_request_guard.py
          src/kefe_api/modules/identity/otp_request_guard.py
          migrations/versions/20260805_0031_otp_request_abuse_guard.py
          tests/test_otp_request_abuse_guard.py
          tests/test_otp_request_abuse_guard_postgres.py
          tools/check_otp_request_abuse_guard_contract.py
      - name: Executable OTP request abuse guard contract
        working-directory: services/api
        run: python tools/check_otp_request_abuse_guard_contract.py
      - name: Exact OpenAPI remains unchanged
        working-directory: services/api
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Memory guard delivery replay privacy and account regression proof
        working-directory: services/api
        run: >-
          pytest -q
          tests/test_otp_request_abuse_guard.py
          tests/test_otp_http_delivery.py
          tests/test_guest_merge_key_rotation.py
          tests/test_guest_merge_replay.py
          tests/test_guest_session_rotation.py
          tests/test_mvp_completion.py
          tests/test_privacy_export_deletion_hardening.py

  postgres:
    needs: memory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Seed canonical fixtures
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: |
          python -m kefe_api.infrastructure.seed_demo
          python -m kefe_api.infrastructure.seed_context_demo
          python -m kefe_api.infrastructure.seed_beta_catalog
      - name: PostgreSQL guard replay privacy and continuity proof
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_PERSISTENCE_BACKEND: postgres
          KEFE_RUN_POSTGRES_TESTS: "1"
          KEFE_ACCOUNT_MERGE_REPLAY_ACTIVE_KEY_ID: ci-primary-v1
          KEFE_ACCOUNT_MERGE_REPLAY_SECRET: ci-guest-merge-replay-secret-0123456789012345
          KEFE_ACCOUNT_MERGE_REPLAY_RETAINED_KEYS: '{}'
        run: >-
          pytest -q
          tests/test_otp_request_abuse_guard_postgres.py
          tests/test_guest_merge_key_rotation_postgres.py
          tests/test_guest_merge_replay_postgres.py
          tests/test_mvp_completion_postgres.py
          tests/test_privacy_export_deletion_hardening_postgres.py
