name: Sync Contract Check PR85

on:
  push:
    branches:
      - feature/my-kefe-journey-api

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-kefe-journey-api
          fetch-depth: 0
      - name: Synchronize contract fitness assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/tools/check_contract_sync.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('contract.get("info", {}).get("version") != "0.16.0"', 'contract.get("info", {}).get("version") != "0.17.0"', 1)
          text = text.replace('OpenAPI checked-in version must match API v0.16.0', 'OpenAPI checked-in version must match API v0.17.0', 1)
          text = text.replace(
              '        "ProgressEnvelopeResponse",\n',
              '        "ProgressEnvelopeResponse",\n        "DomainActivityResponse",\n        "RecentJourneyResponse",\n        "JourneyResponse",\n',
              1,
          )
          text = text.replace(
              '        "ProgressEnvelopeResponse": {"account_offer", "progress", "methodology"},',
              '        "ProgressEnvelopeResponse": {"account_offer", "progress", "journey", "methodology"},\n        "DomainActivityResponse": {"primary_domain", "committed_weigh_count", "last_committed_at"},\n        "RecentJourneyResponse": {"case_id", "case_version_id", "title", "primary_domain", "initial_committed_at", "latest_decision_at", "decision_update_count", "reflection_completed"},\n        "JourneyResponse": {"decision_update_count", "revisited_case_count", "reflection_completion_count", "domain_activity", "recent_journeys"},',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sync-contract-check-pr85.yml
      - name: Commit synchronized fitness gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tools/check_contract_sync.py .github/workflows/sync-contract-check-pr85.yml
          git commit -m 'Synchronize My KEFE journey contract fitness gate'
          git push origin HEAD:feature/my-kefe-journey-api
