name: Admin Editorial Quality Review Bootstrap

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "services/api/src/kefe_api/modules/admin_security/editorial_quality_review_router.py"
      - "services/api/src/kefe_api/modules/admin_security/content_authoring.py"
      - "services/api/src/kefe_api/modules/content_authoring/**"
      - "services/api/src/kefe_api/infrastructure/postgres_flow_pinned_content_authoring.py"
      - "services/api/src/kefe_api/main.py"
      - "services/api/tests/test_admin_editorial_quality_review_http.py"
      - "services/api/tests/test_admin_editorial_quality_review_http_postgres.py"
      - "services/api/tools/check_admin_editorial_quality_review_contract.py"
      - "services/api/tools/export_admin_editorial_quality_review_openapi_overlay.py"
      - "docs/adr/0102-admin-editorial-quality-review-workspace.md"
      - "docs/contracts/admin-editorial-quality-review-workspace.v1.json"
      - ".github/workflows/admin-editorial-quality-review-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: editorial-review-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-memory-and-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint review slice
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/admin_security/editorial_quality_review_router.py
          src/kefe_api/modules/admin_security/content_authoring.py
          src/kefe_api/modules/content_authoring/service.py
          src/kefe_api/modules/content_authoring/ports.py
          src/kefe_api/modules/content_authoring/in_memory.py
          src/kefe_api/infrastructure/postgres_flow_pinned_content_authoring.py
          tests/test_admin_editorial_quality_review_http.py
          tests/test_admin_editorial_quality_review_http_postgres.py
          tools/check_admin_editorial_quality_review_contract.py
          tools/export_admin_editorial_quality_review_openapi_overlay.py
          tools/export_admin_case_builder_openapi_overlay.py
      - name: Executable backend contract
        working-directory: services/api
        run: python tools/check_admin_editorial_quality_review_contract.py
      - name: Generate review OpenAPI overlay
        working-directory: services/api
        run: >-
          python tools/export_admin_editorial_quality_review_openapi_overlay.py
          --output /tmp/openapi-admin-editorial-quality-review.v0.19.overlay.json
      - uses: actions/upload-artifact@v4
        with:
          name: admin-editorial-quality-review-openapi-overlay
          path: /tmp/openapi-admin-editorial-quality-review.v0.19.overlay.json
          if-no-files-found: error
      - name: Memory HTTP behavior
        working-directory: services/api
        run: pytest -q tests/test_admin_editorial_quality_review_http.py

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install locked Admin dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Admin workspace
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run verify
