name: Slice3 Format Fix

on:
  push:
    branches: [feature/premium-perspective-slice3]
    paths:
      - '.github/workflows/slice3-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-perspective-slice3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Slice 3 Dart sources
        working-directory: apps/mobile
        run: dart format lib/features/decision/presentation/perspective_section.dart test/premium_perspective_slice3_test.dart
      - name: Commit source-only formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/features/decision/presentation/perspective_section.dart apps/mobile/test/premium_perspective_slice3_test.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git commit -m 'style: normalize Perspective slice 3 formatting'
          git push origin HEAD:feature/premium-perspective-slice3
