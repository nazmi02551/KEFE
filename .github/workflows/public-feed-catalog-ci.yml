name: Public Feed Catalog CI

on:
  pull_request:
    paths:
      - "services/api/migrations/versions/20260803_0026_public_feed_catalog.py"
      - "services/api/src/kefe_api/modules/knowledge/public_feed_catalog.py"
      - "services/api/src/kefe_api/infrastructure/postgres_public_feed_catalog.py"
      - "services/api/src/kefe_api/modules/admin_security/public_feed_catalog_router.py"
      - "services/api/src/kefe_api/modules/admin_security/models.py"
      - "services/api/src/kefe_api/modules/admin_security/policy.py"
      - "services/api/src/kefe_api/modules/admin_security/service.py"
      - "services/api/src/kefe_api/infrastructure/persistence.py"
      - "services/api/src/kefe_api/main.py"
      - "services/api/tests/test_public_feed_catalog.py"
      - "services/api/tests/test_public_feed_catalog_http.py"
      - "services/api/tests/test_public_feed_catalog_postgres.py"
      - "services/api/tests/test_public_feed_catalog_architecture.py"
      - "services/api/tools/check_public_feed_catalog_contract.py"
      - "services/api/tools/export_public_feed_catalog_openapi_overlay.py"
      - "services/api/tools/export_admin_proposal_queue_openapi_overlay.py"
      - "services/api/tools/export_mvp_openapi_overlay.py"
      - "services/api/tools/export_openapi.py"
      - "docs/adr/0091-durable-public-feed-catalog-and-secured-admin-lifecycle.md"
      - "docs/contracts/public-feed-catalog-slice55.v1.json"
      - "docs/contracts/openapi-public-feed-catalog.v0.19.overlay.json"
      - "docs/contracts/error-codes.v1.yaml"
      - ".github/workflows/public-feed-catalog-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-feed-catalog:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
      KEFE_RUN_POSTGRES_TESTS: "1"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff public feed catalog boundary
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/public_feed_catalog.py
          src/kefe_api/infrastructure/postgres_public_feed_catalog.py
          src/kefe_api/modules/admin_security/public_feed_catalog_router.py
          src/kefe_api/modules/admin_security/models.py
          src/kefe_api/modules/admin_security/policy.py
          src/kefe_api/modules/admin_security/service.py
          src/kefe_api/infrastructure/persistence.py
          src/kefe_api/main.py
          tests/test_public_feed_catalog.py
          tests/test_public_feed_catalog_http.py
          tests/test_public_feed_catalog_postgres.py
          tests/test_public_feed_catalog_architecture.py
          tools/check_public_feed_catalog_contract.py
          tools/export_public_feed_catalog_openapi_overlay.py
          tools/export_admin_proposal_queue_openapi_overlay.py
          tools/export_mvp_openapi_overlay.py
          tools/export_openapi.py
          migrations/versions/20260803_0026_public_feed_catalog.py
      - name: Public feed catalog architecture fitness
        run: python tools/check_public_feed_catalog_contract.py
      - name: Parent public feed runtime architecture fitness
        run: python tools/check_public_feed_runtime_contract.py
      - name: Parent Admin HTTP architecture fitness
        run: python tools/check_admin_http_contract.py
      - name: Contract registry sync
        run: python tools/check_contract_sync.py
      - name: Public feed catalog OpenAPI overlay exact gate
        run: >-
          python tools/export_public_feed_catalog_openapi_overlay.py
          --output ../../docs/contracts/openapi-public-feed-catalog.v0.19.overlay.json
          --check
      - name: MVP OpenAPI overlay isolation gate
        run: >-
          python tools/export_mvp_openapi_overlay.py
          --output ../../docs/contracts/openapi-mvp.v0.19.overlay.json
          --check
      - name: Composed OpenAPI exact gate
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Public feed catalog memory and Admin HTTP behavior
        run: >-
          pytest
          tests/test_public_feed_catalog.py
          tests/test_public_feed_catalog_http.py
          tests/test_public_feed_catalog_architecture.py
      - name: Migrate PostgreSQL
        run: alembic upgrade head
      - name: Public feed catalog PostgreSQL behavior
        run: pytest tests/test_public_feed_catalog_postgres.py
      - name: Verify clean catalog downgrade and upgrade
        run: |
          alembic downgrade 20260803_0025
          alembic upgrade head
