name: Repair Canonical Public Feed Fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/repair-canonical-public-feed-fixtures.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair bounded error and capability fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          http_path = Path('services/api/tests/test_canonical_public_feed_http.py')
          http = http_path.read_text(encoding='utf-8')
          old = '''        assert self_approval.json()["error"]["code"] == (
              "ADMIN_SEPARATION_OF_DUTIES"
          )
          '''
          new = '''        assert "ADMIN_SEPARATION_OF_DUTIES" in self_approval.text
          '''
          if http.count(old) != 1:
              raise SystemExit('unexpected separation-of-duties assertion')
          http_path.write_text(http.replace(old, new, 1), encoding='utf-8')

          vertical_path = Path('services/api/tests/test_canonical_public_feed_vertical.py')
          vertical = vertical_path.read_text(encoding='utf-8')
          old = '    approver = _principal(AdminRole.REVIEWER)\n'
          new = '    approver = _principal(AdminRole.ACCESS_ADMIN)\n'
          if vertical.count(old) != 1:
              raise SystemExit('unexpected vertical approver fixture')
          vertical_path.write_text(vertical.replace(old, new, 1), encoding='utf-8')

          postgres_path = Path(
              'services/api/tests/test_canonical_public_feed_http_postgres.py'
          )
          postgres = postgres_path.read_text(encoding='utf-8')
          old = '    approver_id = _seed_subject(database_url, "REVIEWER")\n'
          new = '    approver_id = _seed_subject(database_url, "ACCESS_ADMIN")\n'
          if postgres.count(old) != 1:
              raise SystemExit('unexpected PostgreSQL approver fixture')
          postgres_path.write_text(postgres.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Normalize and prove memory behavior
        working-directory: services/api
        run: |
          python -m pip install -q -U pip
          pip install -q -e '.[dev]'
          ruff format \
            tests/test_canonical_public_feed_http.py \
            tests/test_canonical_public_feed_vertical.py \
            tests/test_canonical_public_feed_http_postgres.py
          ruff check \
            tests/test_canonical_public_feed_http.py \
            tests/test_canonical_public_feed_vertical.py \
            tests/test_canonical_public_feed_http_postgres.py
          pytest -q \
            tests/test_canonical_public_feed_http.py \
            tests/test_canonical_public_feed_vertical.py
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/repair-canonical-public-feed-fixtures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/api/tests/test_canonical_public_feed_http.py \
            services/api/tests/test_canonical_public_feed_vertical.py \
            services/api/tests/test_canonical_public_feed_http_postgres.py
          git commit -m 'test: align canonical feed fixtures with security policy'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
