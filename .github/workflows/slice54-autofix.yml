name: Slice 54 One Shot Normalize

on:
  push:
    branches:
      - feature/feed-activation-governance-slice54
    paths:
      - '.github/workflows/slice54-autofix.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/feed-activation-governance-slice54
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Normalize targeted Slice 54 files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/test_feed_activation_postgres.py')
          content = path.read_text(encoding='utf-8')
          content = content.replace(
              'from sqlalchemy import create_engine, text\n',
              'from sqlalchemy import create_engine, text\n'
              'from sqlalchemy.exc import IntegrityError\n',
          )
          content = content.replace(
              'with pytest.raises(Exception):',
              'with pytest.raises(IntegrityError):',
          )
          path.write_text(content, encoding='utf-8')
          PY
          cd services/api
          ruff check --fix \
            src/kefe_api/modules/knowledge/feed_activation.py \
            src/kefe_api/modules/knowledge/source_evidence.py \
            src/kefe_api/infrastructure/feed_activation_runtime.py \
            src/kefe_api/infrastructure/postgres_feed_activation.py \
            src/kefe_api/infrastructure/raw_evidence_runtime.py \
            tests/test_feed_activation.py \
            tests/test_feed_activation_postgres.py \
            tests/test_feed_activation_runtime.py \
            tests/test_feed_activation_architecture.py \
            tests/test_raw_evidence_runtime.py \
            tools/check_feed_activation_contract.py
          ruff format \
            src/kefe_api/modules/knowledge/feed_activation.py \
            src/kefe_api/modules/knowledge/source_evidence.py \
            src/kefe_api/infrastructure/feed_activation_runtime.py \
            src/kefe_api/infrastructure/postgres_feed_activation.py \
            src/kefe_api/infrastructure/raw_evidence_runtime.py \
            tests/test_feed_activation.py \
            tests/test_feed_activation_postgres.py \
            tests/test_feed_activation_runtime.py \
            tests/test_feed_activation_architecture.py \
            tests/test_raw_evidence_runtime.py \
            tools/check_feed_activation_contract.py
          ruff check \
            src/kefe_api/modules/knowledge/feed_activation.py \
            src/kefe_api/modules/knowledge/source_evidence.py \
            src/kefe_api/infrastructure/feed_activation_runtime.py \
            src/kefe_api/infrastructure/postgres_feed_activation.py \
            src/kefe_api/infrastructure/raw_evidence_runtime.py \
            tests/test_feed_activation.py \
            tests/test_feed_activation_postgres.py \
            tests/test_feed_activation_runtime.py \
            tests/test_feed_activation_architecture.py \
            tests/test_raw_evidence_runtime.py \
            tools/check_feed_activation_contract.py
          pytest -q \
            tests/test_feed_activation.py \
            tests/test_feed_activation_runtime.py \
            tests/test_feed_activation_architecture.py \
            tests/test_raw_evidence_runtime.py
      - name: Commit normalized sources
        run: |
          rm .github/workflows/slice54-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: normalize and validate Slice 54 governance'
          git push origin HEAD:feature/feed-activation-governance-slice54
