name: Apply Progressive Surface Patch Only

on:
  push:
    branches:
      - feature/progressive-result-context-history

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progressive-result-context-history
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Execute governed patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-progressive-result-context-history.yml').read_text()

          python_marker = "          python - <<'PY'\n"
          python_start = workflow.index(python_marker) + len(python_marker)
          python_end = workflow.index("\n          PY", python_start)
          patch_source = textwrap.dedent(workflow[python_start:python_end])
          exec(compile(patch_source, '<progressive-surface-patch>', 'exec'))

          dart_marker = "          cat > apps/mobile/test/remaining_progressive_surfaces_test.dart <<'DART'\n"
          dart_start = workflow.index(dart_marker) + len(dart_marker)
          dart_end = workflow.index("\n          DART", dart_start)
          dart_source = textwrap.dedent(workflow[dart_start:dart_end]) + '\n'
          Path('apps/mobile/test/remaining_progressive_surfaces_test.dart').write_text(dart_source)
          PY
      - name: Format integrated sources
        working-directory: apps/mobile
        run: dart format lib test
      - name: Remove temporary integration machinery
        run: |
          git rm -f \
            .github/workflows/apply-progressive-result-context-history.yml \
            .github/workflows/apply-progressive-surface-patch-only.yml \
            docs/status/.progressive-surfaces-trigger
      - name: Commit integrated vertical slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/lib apps/mobile/test docs .github/workflows
          git commit -m "feat: complete progressive Result Context and history journeys"
          git push origin HEAD:feature/progressive-result-context-history
