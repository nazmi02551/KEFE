name: Canonical Candidate Bundle Projection

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/src/kefe_api/modules/admin_security/candidate_bundle*.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/candidate_case_bundle.py'
      - 'services/api/tests/test_canonical_candidate_bundle_projection*.py'
      - 'services/api/tools/check_canonical_candidate_bundle_projection.py'
      - 'docs/adr/0099-canonical-source-brief-candidate-bundle-and-explicit-projection.md'
      - 'docs/contracts/canonical-candidate-bundle-projection.v1.json'
      - 'docs/contracts/error-codes.canonical-candidate-bundle.v1.yaml'
      - '.github/workflows/canonical-candidate-bundle-projection.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/src/kefe_api/modules/admin_security/candidate_bundle*.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/candidate_case_bundle.py'
      - 'services/api/tests/test_canonical_candidate_bundle_projection*.py'
      - 'services/api/tools/check_canonical_candidate_bundle_projection.py'
      - 'docs/adr/0099-canonical-source-brief-candidate-bundle-and-explicit-projection.md'
      - 'docs/contracts/canonical-candidate-bundle-projection.v1.json'
      - 'docs/contracts/error-codes.canonical-candidate-bundle.v1.yaml'
      - '.github/workflows/canonical-candidate-bundle-projection.yml'

permissions:
  contents: read

jobs:
  memory-http-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff
        working-directory: services/api
        run: ruff check .
      - name: Architecture contract
        working-directory: services/api
        run: python tools/check_canonical_candidate_bundle_projection.py
      - name: Candidate bundle and explicit projection behavior
        working-directory: services/api
        run: >-
          pytest -q
          tests/test_canonical_candidate_bundle_projection_http.py
          tests/test_admin_editorial_operations_http.py
          tests/test_admin_source_brief_review_http.py
