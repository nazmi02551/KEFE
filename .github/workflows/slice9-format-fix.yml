name: Slice9 Format Fix

on:
  push:
    branches: [feature/localization-convergence-slice9]
    paths:
      - '.github/workflows/slice9-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/localization-convergence-slice9
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Slice 9 Dart sources
        working-directory: apps/mobile
        run: dart format lib/core/localization/settings_string_catalog.dart lib/core/localization/explore_string_catalog.dart lib/core/localization/settings_strings.dart lib/core/localization/explore_strings.dart lib/app/product_preview/radar_preview_strings.dart lib/app/product_preview/atlas_preview_strings.dart test/localization_convergence_slice9_test.dart
      - name: Commit source-only formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/core/localization/settings_string_catalog.dart apps/mobile/lib/core/localization/explore_string_catalog.dart apps/mobile/lib/core/localization/settings_strings.dart apps/mobile/lib/core/localization/explore_strings.dart apps/mobile/lib/app/product_preview/radar_preview_strings.dart apps/mobile/lib/app/product_preview/atlas_preview_strings.dart apps/mobile/test/localization_convergence_slice9_test.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git commit -m 'style: normalize localization convergence slice 9'
          git push origin HEAD:feature/localization-convergence-slice9

# trigger
