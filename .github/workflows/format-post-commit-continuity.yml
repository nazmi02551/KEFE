name: Format Post-Commit Continuity

on:
  push:
    branches:
      - fix/post-commit-capability-continuity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-commit-capability-continuity
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/decision/presentation/decision_experience_screen.dart test/progressive_result_disclosure_test.dart
      - name: Commit normalized sources
        run: |
          if git diff --quiet -- lib/features/decision/presentation/decision_experience_screen.dart test/progressive_result_disclosure_test.dart; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/decision/presentation/decision_experience_screen.dart test/progressive_result_disclosure_test.dart
          git commit -m "style: normalize post-commit continuity sources"
          git push origin HEAD:fix/post-commit-capability-continuity
