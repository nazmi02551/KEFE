name: Format Progressive Surfaces

on:
  push:
    branches:
      - feature/progressive-result-context-history

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progressive-result-context-history
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format governed mobile sources
        working-directory: apps/mobile
        run: dart format lib test
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/mobile/lib apps/mobile/test; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/lib apps/mobile/test
          git commit -m "style: normalize progressive surface sources"
          git push origin HEAD:feature/progressive-result-context-history
