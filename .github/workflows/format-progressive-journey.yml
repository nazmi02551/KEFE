name: Format Progressive Journey

on:
  push:
    branches:
      - feature/progressive-active-step-journey

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progressive-active-step-journey
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target files
        working-directory: apps/mobile
        run: |
          dart format \
            lib/core/config/experience_presentation_config.dart \
            lib/core/design/kefe_active_journey.dart \
            lib/features/decision/presentation/decision_flow_screen.dart \
            lib/features/decision/presentation/decision_journey_strings.dart \
            lib/features/onboarding/presentation/onboarding_gate_screen.dart \
            lib/features/onboarding/presentation/onboarding_v2_strings.dart \
            test/decision_journey_legacy_mode_test.dart \
            test/decision_journey_stage_resolver_test.dart \
            test/experience_presentation_config_test.dart \
            test/onboarding_flow_test.dart
      - name: Commit normalized formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib apps/mobile/test
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "Normalize progressive journey Dart formatting"
          git push origin HEAD:feature/progressive-active-step-journey
