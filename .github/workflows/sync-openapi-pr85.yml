name: Sync OpenAPI PR85

on:
  push:
    branches:
      - feature/my-kefe-journey-api

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-kefe-journey-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Generate exact OpenAPI and sync manifest
        run: |
          cd services/api
          python tools/export_openapi.py --output ../../docs/contracts/openapi.v1.json
          cd ../..
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/contracts/manifest.v1.yaml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('manifest_version: 1.34.0', 'manifest_version: 1.35.0', 1)
          text = text.replace('    version: 0.16.0\n    role: http_api_contract', '    version: 0.17.0\n    role: http_api_contract', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sync-openapi-pr85.yml
      - name: Commit synchronized contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/contracts/openapi.v1.json docs/contracts/manifest.v1.yaml .github/workflows/sync-openapi-pr85.yml
          git commit -m 'Synchronize My KEFE journey OpenAPI contract'
          git push origin HEAD:feature/my-kefe-journey-api
