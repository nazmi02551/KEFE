name: Ingestion Worker CI

on:
  pull_request:
    paths:
      - 'services/api/migrations/versions/20260802_0020_ingestion_orchestration.py'
      - 'services/api/migrations/versions/20260802_0021_ingestion_run_leases.py'
      - 'services/api/migrations/versions/20260803_0026_feed_pipeline_activation.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/*.py'
      - 'services/api/src/kefe_api/modules/knowledge/feed_activation.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_orchestration.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_run_leases.py'
      - 'services/api/src/kefe_api/infrastructure/feed_activation_runtime.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_ingestion_worker_runner*.py'
      - 'services/api/tests/test_feed_item_extraction.py'
      - 'services/api/tests/test_feed_activation*.py'
      - 'services/api/tools/check_ingestion_worker_runner_contract.py'
      - 'services/api/tools/check_feed_item_extraction_contract.py'
      - 'services/api/tools/check_feed_activation_contract.py'
      - 'docs/adr/0074-lease-supervised-ingestion-worker-runner.md'
      - 'docs/contracts/ingestion-worker-runner-slice38.v1.json'
      - 'docs/adr/0089-immutable-feed-evidence-reading-and-bounded-item-extraction.md'
      - 'docs/contracts/feed-item-extraction-slice53.v1.json'
      - 'docs/adr/0090-feed-pipeline-activation-governance-and-read-only-preflight.md'
      - 'docs/contracts/feed-pipeline-activation-slice54.v1.json'
      - '.github/workflows/ingestion-worker-ci.yml'
      - '.github/workflows/feed-activation-governance-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/migrations/versions/20260802_0020_ingestion_orchestration.py'
      - 'services/api/migrations/versions/20260802_0021_ingestion_run_leases.py'
      - 'services/api/migrations/versions/20260803_0026_feed_pipeline_activation.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/*.py'
      - 'services/api/src/kefe_api/modules/knowledge/feed_activation.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_orchestration.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_run_leases.py'
      - 'services/api/src/kefe_api/infrastructure/feed_activation_runtime.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_ingestion_worker_runner*.py'
      - 'services/api/tests/test_feed_item_extraction.py'
      - 'services/api/tests/test_feed_activation*.py'
      - 'services/api/tools/check_ingestion_worker_runner_contract.py'
      - 'services/api/tools/check_feed_item_extraction_contract.py'
      - 'services/api/tools/check_feed_activation_contract.py'
      - 'docs/adr/0074-lease-supervised-ingestion-worker-runner.md'
      - 'docs/contracts/ingestion-worker-runner-slice38.v1.json'
      - 'docs/adr/0089-immutable-feed-evidence-reading-and-bounded-item-extraction.md'
      - 'docs/contracts/feed-item-extraction-slice53.v1.json'
      - 'docs/adr/0090-feed-pipeline-activation-governance-and-read-only-preflight.md'
      - 'docs/contracts/feed-pipeline-activation-slice54.v1.json'
      - '.github/workflows/ingestion-worker-ci.yml'
      - '.github/workflows/feed-activation-governance-ci.yml'

permissions:
  contents: read

jobs:
  ingestion-worker-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff ingestion worker boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/ingestion_orchestration/worker_runtime.py
          src/kefe_api/modules/ingestion_orchestration/worker_service.py
          src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py
          tests/test_ingestion_worker_runner.py
          tests/test_feed_item_extraction.py
          tools/check_ingestion_worker_runner_contract.py
          tools/check_feed_item_extraction_contract.py
      - name: Ingestion worker architecture fitness
        working-directory: services/api
        run: python tools/check_ingestion_worker_runner_contract.py
      - name: Feed item extraction architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_extraction_contract.py
      - name: Ingestion worker memory behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_ingestion_worker_runner.py
          tests/test_feed_item_extraction.py

  ingestion-worker-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Ingestion worker PostgreSQL behavior
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: pytest tests/test_ingestion_worker_runner_postgres.py
