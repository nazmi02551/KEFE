name: Finalize M3 Reflection Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/pr63-mobile-reflection-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'recovery/m3-reflection-runtime-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Apply the already-reviewed Reflection mobile patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/mobile-ci.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<m3-reflection-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Restore strict read-only CI
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/api-ci.yml .github/workflows/mobile-ci.yml
      - name: Remove recovery-only scaffolding
        run: |
          rm -f apps/mobile/lib/features/decision/data/http_reflection_decision_repository.dart
          git rm .github/workflows/pr63-mobile-reflection-patch.yml
      - name: Format changed Dart files
        working-directory: apps/mobile
        run: dart format lib/features/decision/data/http_decision_repository.dart lib/features/decision/application/decision_controller.dart lib/features/decision/presentation/decision_flow_screen.dart lib/core/localization/kefe_strings.dart
      - name: Commit finalized Reflection mobile slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize generic Reflection mobile runtime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
