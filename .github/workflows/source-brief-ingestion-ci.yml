name: Source Brief Ingestion CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/**'
      - 'services/api/src/kefe_api/modules/knowledge/**'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_source_brief_ingestion_http.py'
      - 'services/api/tests/test_source_brief_ingestion_http_postgres.py'
      - 'services/api/tools/check_source_brief_ingestion_contract.py'
      - 'services/api/tools/check_admin_feed_item_review_contract.py'
      - 'services/api/tools/check_ingestion_orchestration_contract.py'
      - 'services/api/tools/check_atomic_ingestion_stage_batch_contract.py'
      - 'docs/adr/0091-accepted-feed-item-normalization-and-source-brief-ingestion.md'
      - 'docs/contracts/source-brief-ingestion-slice55.v1.json'
      - 'docs/contracts/error-codes.source-brief-ingestion.v1.yaml'
      - '.github/workflows/source-brief-ingestion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/**'
      - 'services/api/src/kefe_api/modules/knowledge/**'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_source_brief_ingestion_http.py'
      - 'services/api/tests/test_source_brief_ingestion_http_postgres.py'
      - 'services/api/tools/check_source_brief_ingestion_contract.py'
      - 'services/api/tools/check_admin_feed_item_review_contract.py'
      - 'services/api/tools/check_ingestion_orchestration_contract.py'
      - 'services/api/tools/check_atomic_ingestion_stage_batch_contract.py'
      - 'docs/adr/0091-accepted-feed-item-normalization-and-source-brief-ingestion.md'
      - 'docs/contracts/source-brief-ingestion-slice55.v1.json'
      - 'docs/contracts/error-codes.source-brief-ingestion.v1.yaml'
      - '.github/workflows/source-brief-ingestion-ci.yml'

permissions:
  contents: read

jobs:
  source-brief-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff Source Brief boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py
          src/kefe_api/modules/admin_security/source_brief_ingestion.py
          src/kefe_api/modules/admin_security/source_brief_ingestion_router.py
          tests/test_source_brief_ingestion_http.py
          tests/test_source_brief_ingestion_http_postgres.py
          tools/check_source_brief_ingestion_contract.py
      - name: Source Brief ingestion architecture and OpenAPI fitness
        working-directory: services/api
        run: python tools/check_source_brief_ingestion_contract.py
      - name: Parent Admin feed item review architecture fitness
        working-directory: services/api
        run: python tools/check_admin_feed_item_review_contract.py
      - name: Parent ingestion orchestration contract
        working-directory: services/api
        run: python tools/check_ingestion_orchestration_contract.py
      - name: Parent atomic stage batch contract
        working-directory: services/api
        run: python tools/check_atomic_ingestion_stage_batch_contract.py
      - name: Source Brief ingestion memory HTTP
        working-directory: services/api
        run: >-
          pytest
          tests/test_source_brief_ingestion_http.py
          tests/test_admin_feed_item_review_http.py
          tests/test_ingestion_orchestration.py

  source-brief-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Source Brief ingestion PostgreSQL HTTP
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_source_brief_ingestion_http_postgres.py
          tests/test_admin_feed_item_review_http_postgres.py
          tests/test_ingestion_orchestration_postgres.py
