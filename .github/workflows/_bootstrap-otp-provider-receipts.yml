name: Bootstrap OTP Provider Receipt Slice

on:
  pull_request:
    paths:
      - ".github/workflows/_bootstrap-otp-provider-receipts.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-otp-provider-receipts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply contract-first OTP provider receipt slice
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          FILES = {'services/api/src/kefe_api/modules/identity/otp_provider_receipts.py': '    ', 'services/api/src/kefe_api/modules/identity/otp_provider_receipts_router.py': '', 'services/api/src/kefe_api/infrastructure/postgres_otp_provider_receipts.py': '', 'services/api/migrations/versions/20260806_0034_otp_provider_receipts.py': '', 'services/api/tests/test_otp_provider_receipts.py': '<SECRET><SECRET>NCIKCiAgICBhdHRlbXB0cyA9ICgKICAgICAgICB7CiAgICAgICAgICAgICJ0aW1lc3RhbXAiOiBzdHIoaW50KG5vdy50aW1lc3RhbXAoKSkpLAogICAgICAgICAgICAia2V5X2lkIjogX0tFWV9JRCwKICAgICAgICAgICAgInNpZ25hdHVyZSI6ICIwIiAqIDY0LAogICAgICAgIH0sCiAgICAgICAgewogICAgICAgICAgICAidGltZXN0YW1wIjogc3RyKGludCgo <SECRET>', 'services/api/tests/test_otp_provider_receipts_http.py': '<SECRET><SECRET><SECRET>', 'services/api/tests/test_otp_provider_receipts_postgres.py': '<SECRET>R<SECRET>R<SECRET><SECRET><SECRET> ', 'services/api/tools/check_otp_provider_receipts_contract.py': '<SECRET><SECRET>iIH0=', 'docs/status/F4_OTP_PROVIDER_RECEIPTS_2026-08-06.md': '', '.github/workflows/otp-provider-receipts.yml': ' '}

          for relative, encoded in FILES.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"Expected exactly one patch anchor in {path}; found {text.count(old)}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "services/api/src/kefe_api/core/settings.py",
              """    otp_delivery_alert_retention_seconds: int = Field(
                  default=2_592_000,
                  ge=3_600,
                  le=7_776_000,
              )
              otp_request_guard_mode: Literal["AUTO", "OFF", "ENFORCE"] = "AUTO"
          """,
              """    otp_delivery_alert_retention_seconds: int = Field(
                  default=2_592_000,
                  ge=3_600,
                  le=7_776_000,
              )
              otp_receipt_mode: Literal["DISABLED", "HMAC_SHA256"] = "DISABLED"
              otp_receipt_secret_refs: dict[str, str] = Field(default_factory=dict)
              otp_receipt_secret_lease_seconds: int = Field(default=30, ge=1, le=300)
              otp_receipt_max_skew_seconds: int = Field(default=300, ge=30, le=3_600)
              otp_receipt_max_body_bytes: int = Field(default=4_096, ge=256, le=65_536)
              otp_receipt_retention_seconds: int = Field(
                  default=2_592_000,
                  ge=86_400,
                  le=7_776_000,
              )
              otp_request_guard_mode: Literal["AUTO", "OFF", "ENFORCE"] = "AUTO"
          """,
          )

          replace_once(
              "services/api/src/kefe_api/infrastructure/persistence.py",
              """from kefe_api.infrastructure.postgres_otp_delivery_health import (
              PostgresOtpDeliveryHealthRepository,
          )
          from kefe_api.infrastructure.postgres_otp_request_guard import (
          """,
              """from kefe_api.infrastructure.postgres_otp_delivery_health import (
              PostgresOtpDeliveryHealthRepository,
          )
          from kefe_api.infrastructure.postgres_otp_provider_receipts import (
              PostgresOtpProviderReceiptRepository,
          )
          from kefe_api.infrastructure.postgres_otp_request_guard import (
          """,
          )
          replace_once(
              "services/api/src/kefe_api/infrastructure/persistence.py",
              """from kefe_api.modules.identity.otp_delivery_health import (
              InMemoryOtpDeliveryHealthRepository,
              OtpDeliveryAlertPolicy,
              OtpDeliveryHealthPolicy,
              OtpDeliveryHealthRepository,
          )
          from kefe_api.modules.identity.otp_request_guard import (
          """,
              """from kefe_api.modules.identity.otp_delivery_health import (
              InMemoryOtpDeliveryHealthRepository,
              OtpDeliveryAlertPolicy,
              OtpDeliveryHealthPolicy,
              OtpDeliveryHealthRepository,
          )
          from kefe_api.modules.identity.otp_provider_receipts import (
              InMemoryOtpProviderReceiptRepository,
              OtpProviderReceiptRepository,
          )
          from kefe_api.modules.identity.otp_request_guard import (
          """,
          )
          replace_once(
              "services/api/src/kefe_api/infrastructure/persistence.py",
              """    return PostgresOtpDeliveryHealthRepository(
                  build_engine(settings.database_url),
                  health_policy=health_policy,
                  alert_policy=alert_policy,
              )


          def _otp_request_abuse_policy(settings: Settings) -> OtpRequestAbusePolicy:
          """,
              """    return PostgresOtpDeliveryHealthRepository(
                  build_engine(settings.database_url),
                  health_policy=health_policy,
                  alert_policy=alert_policy,
              )


          def build_otp_provider_receipt_repository(
              settings: Settings,
          ) -> OtpProviderReceiptRepository:
              if settings.persistence_backend == "memory":
                  return InMemoryOtpProviderReceiptRepository()
              if not settings.database_url:
                  raise RuntimeError(
                      "KEFE_DATABASE_URL is required when persistence_backend=postgres"
                  )
              return PostgresOtpProviderReceiptRepository(build_engine(settings.database_url))


          def _otp_request_abuse_policy(settings: Settings) -> OtpRequestAbusePolicy:
          """,
          )

          replace_once(
              "services/api/src/kefe_api/main.py",
              """    build_identity_repository,
              build_otp_delivery_health_repository,
              build_privacy_repository,
          """,
              """    build_identity_repository,
              build_otp_delivery_health_repository,
              build_otp_provider_receipt_repository,
              build_privacy_repository,
          """,
          )
          replace_once(
              "services/api/src/kefe_api/main.py",
              """from kefe_api.modules.identity.otp_delivery_health import (
              DurableOtpDeliveryObserver,
              FailOpenOtpDeliveryObserver,
              OtpDeliveryHealthPolicy,
              OtpDeliveryHealthService,
          )
          from kefe_api.modules.identity.router import router as identity_router
          """,
              """from kefe_api.modules.identity.otp_delivery_health import (
              DurableOtpDeliveryObserver,
              FailOpenOtpDeliveryObserver,
              OtpDeliveryHealthPolicy,
              OtpDeliveryHealthService,
          )
          from kefe_api.modules.identity.otp_provider_receipts import (
              build_otp_provider_receipt_service,
          )
          from kefe_api.modules.identity.otp_provider_receipts_router import (
              router as otp_provider_receipts_router,
          )
          from kefe_api.modules.identity.router import router as identity_router
          """,
          )
          replace_once(
              "services/api/src/kefe_api/main.py",
              """    otp_delivery_health_repository = build_otp_delivery_health_repository(settings)
              otp_delivery_health_policy = OtpDeliveryHealthPolicy.from_seconds(
          """,
              """    otp_delivery_health_repository = build_otp_delivery_health_repository(settings)
              otp_provider_receipt_repository = build_otp_provider_receipt_repository(settings)
              otp_provider_receipt_service = build_otp_provider_receipt_service(
                  settings,
                  repository=otp_provider_receipt_repository,
              )
              otp_delivery_health_policy = OtpDeliveryHealthPolicy.from_seconds(
          """,
          )
          replace_once(
              "services/api/src/kefe_api/main.py",
              """    app.state.otp_delivery_health_observer = otp_delivery_health_observer
              app.state.account_continuity_repository = account_continuity_repository
          """,
              """    app.state.otp_delivery_health_observer = otp_delivery_health_observer
              app.state.otp_provider_receipt_repository = otp_provider_receipt_repository
              app.state.otp_provider_receipt_service = otp_provider_receipt_service
              app.state.account_continuity_repository = account_continuity_repository
          """,
          )
          replace_once(
              "services/api/src/kefe_api/main.py",
              """    app.include_router(identity_router)
              app.include_router(account_router)
              app.include_router(context_router)
          """,
              """    app.include_router(identity_router)
              app.include_router(account_router)
              app.include_router(otp_provider_receipts_router)
              app.include_router(context_router)
          """,
          )

          replace_once(
              "docs/contracts/error-codes.v1.yaml",
              "registry_version: 1.22.0\n",
              "registry_version: 1.23.0\n",
          )
          replace_once(
              "docs/contracts/error-codes.v1.yaml",
              """- code: AUTH_OTP_DELIVERY_REJECTED
            http_status: 502
            retryable: false
          - code: AUTH_RATE_LIMITED
          """,
              """- code: AUTH_OTP_DELIVERY_REJECTED
            http_status: 502
            retryable: false
          - code: AUTH_OTP_RECEIPT_DISABLED
            http_status: 404
            retryable: false
          - code: AUTH_OTP_RECEIPT_AUTH_UNAVAILABLE
            http_status: 503
            retryable: true
          - code: AUTH_OTP_RECEIPT_REJECTED
            http_status: 401
            retryable: false
          - code: AUTH_OTP_RECEIPT_EVENT_CONFLICT
            http_status: 409
            retryable: false
          - code: AUTH_RATE_LIMITED
          """,
          )

          replace_once(
              "services/api/tools/check_otp_delivery_alert_candidates_contract.py",
              "import json\nfrom pathlib import Path\n",
              "import json\nimport re\nfrom pathlib import Path\n",
          )
          replace_once(
              "services/api/tools/check_otp_delivery_alert_candidates_contract.py",
              """def main() -> None:
          """,
              """def _registry_version(text: str) -> tuple[int, int, int]:
              match = re.search(r"^registry_version:\\s*(\\d+)\\.(\\d+)\\.(\\d+)$", text, re.M)
              _require(match is not None, "error registry version format")
              assert match is not None
              return tuple(int(part) for part in match.groups())


          def main() -> None:
          """,
          )
          replace_once(
              "services/api/tools/check_otp_delivery_alert_candidates_contract.py",
              """    _require("registry_version: 1.22.0" in error_codes, "error registry version")
          """,
              """    _require(
                  _registry_version(error_codes) >= (1, 22, 0),
                  "error registry minimum version",
              )
          """,
          )

          PY
      - name: Commit slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(identity): implement authenticated OTP provider receipts"
          git push origin HEAD:${{ github.head_ref }}
