name: Repair Public Feed Vertical Security Clock

on:
  pull_request:
    paths:
      - '.github/workflows/repair-public-feed-vertical-clock.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the deterministic vertical-test clock
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/test_canonical_public_feed_vertical.py')
          source = path.read_text(encoding='utf-8')
          old = '''    security = AdminSecurityService(
              session_resolver=_UnusedSessionResolver(),
              policy=default_admin_security_policy(),
          )
          '''
          new = '''    security = AdminSecurityService(
              session_resolver=_UnusedSessionResolver(),
              policy=default_admin_security_policy(),
              clock=lambda: NOW,
          )
          '''
          if source.count(old) != 1:
              raise SystemExit('unexpected public-feed vertical security fixture')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Prove the affected unit and F2 verticals
        working-directory: services/api
        run: |
          python -m pip install -q -U pip
          pip install -q -e '.[dev]'
          ruff format tests/test_canonical_public_feed_vertical.py
          ruff check tests/test_canonical_public_feed_vertical.py
          pytest -q \
            tests/test_canonical_public_feed_vertical.py \
            tests/test_canonical_candidate_bundle_projection_http.py
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/repair-public-feed-vertical-clock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tests/test_canonical_public_feed_vertical.py
          git commit -m 'test: align public-feed vertical security clock'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
