name: RSS Atom Route Scheduling CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_route_scheduling.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_route.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_scheduler*.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_source_acquisition_scheduler.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_rss_atom_route_scheduling*.py'
      - 'services/api/tools/check_rss_atom_route_scheduling_contract.py'
      - 'docs/adr/0091-route-bound-rss-atom-schedule-creation-and-deterministic-reconciliation.md'
      - 'docs/contracts/rss-atom-route-scheduling-slice55.v1.json'
      - '.github/workflows/rss-atom-route-scheduling-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_route_scheduling.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_route.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_scheduler*.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_source_acquisition_scheduler.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_rss_atom_route_scheduling*.py'
      - 'services/api/tools/check_rss_atom_route_scheduling_contract.py'
      - 'docs/adr/0091-route-bound-rss-atom-schedule-creation-and-deterministic-reconciliation.md'
      - 'docs/contracts/rss-atom-route-scheduling-slice55.v1.json'
      - '.github/workflows/rss-atom-route-scheduling-ci.yml'

permissions:
  contents: read

jobs:
  rss-atom-route-scheduling-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff RSS Atom route scheduling boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/rss_atom_route_scheduling.py
          tests/test_rss_atom_route_scheduling.py
          tests/test_rss_atom_route_scheduling_architecture.py
          tools/check_rss_atom_route_scheduling_contract.py
      - name: RSS Atom route scheduling architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_route_scheduling_contract.py
      - name: Parent source scheduler architecture fitness
        working-directory: services/api
        run: python tools/check_source_acquisition_scheduler_contract.py
      - name: Parent RSS Atom route architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_route_contract.py
      - name: Parent ingestion worker architecture fitness
        working-directory: services/api
        run: python tools/check_ingestion_worker_runner_contract.py
      - name: RSS Atom route scheduling behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_source_acquisition_scheduler.py
          tests/test_rss_atom_route.py
          tests/test_rss_atom_route_scheduling.py

  rss-atom-route-scheduling-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: RSS Atom route scheduling PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_source_acquisition_scheduler_postgres.py
          tests/test_rss_atom_route_scheduling_postgres.py
