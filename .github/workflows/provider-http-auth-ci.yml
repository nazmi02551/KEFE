name: Provider HTTP Authentication CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_auth.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_transport.py'
      - 'services/api/src/kefe_api/infrastructure/provider_http_runtime.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_provider_http_auth*.py'
      - 'services/api/tools/check_provider_http_auth_contract.py'
      - 'docs/adr/0083-ephemeral-provider-http-authentication-and-origin-bound-decoration.md'
      - 'docs/contracts/provider-http-auth-slice47.v1.json'
      - '.github/workflows/provider-http-auth-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_auth.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_transport.py'
      - 'services/api/src/kefe_api/infrastructure/provider_http_runtime.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_provider_http_auth*.py'
      - 'services/api/tools/check_provider_http_auth_contract.py'
      - 'docs/adr/0083-ephemeral-provider-http-authentication-and-origin-bound-decoration.md'
      - 'docs/contracts/provider-http-auth-slice47.v1.json'
      - '.github/workflows/provider-http-auth-ci.yml'

permissions:
  contents: read

jobs:
  provider-http-authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff provider HTTP authentication boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/provider_http_auth.py
          src/kefe_api/modules/knowledge/provider_http_transport.py
          src/kefe_api/infrastructure/provider_http_runtime.py
          src/kefe_api/infrastructure/editorial_pipeline.py
          tests/test_provider_http_auth.py
          tests/test_provider_http_auth_architecture.py
          tools/check_provider_http_auth_contract.py
      - name: Provider HTTP authentication architecture fitness
        working-directory: services/api
        run: python tools/check_provider_http_auth_contract.py
      - name: Provider HTTP authentication behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_provider_http_auth.py
          tests/test_provider_http_auth_architecture.py
