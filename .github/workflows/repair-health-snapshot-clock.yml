name: Repair Health Snapshot Test Clock

on:
  pull_request:
    paths:
      - '.github/workflows/repair-health-snapshot-clock.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Preserve microsecond uniqueness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/test_content_supply_health_postgres.py')
          source = path.read_text(encoding='utf-8')
          old = '    as_of = datetime.now(UTC).replace(microsecond=0) + timedelta(seconds=5)\n'
          new = '    as_of = datetime.now(UTC) + timedelta(seconds=5)\n'
          if source.count(old) != 1:
              raise SystemExit('unexpected health snapshot clock fixture')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/repair-health-snapshot-clock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tests/test_content_supply_health_postgres.py
          git commit -m 'test: keep health snapshot timestamps unique'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
