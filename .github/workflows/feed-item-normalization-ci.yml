name: Feed Item Normalization CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/knowledge_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/service.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_materialization.py'
      - 'services/api/src/kefe_api/modules/admin_security/editorial_projection_router.py'
      - 'services/api/src/kefe_api/modules/knowledge/models.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence.py'
      - 'services/api/src/kefe_api/modules/knowledge/in_memory.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_knowledge.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_orchestration.py'
      - 'services/api/tests/test_feed_item_normalization_materialization.py'
      - 'services/api/tests/test_feed_item_normalization_materialization_postgres.py'
      - 'services/api/tests/test_admin_feed_item_materialization*.py'
      - 'services/api/tools/check_feed_item_normalization_contract.py'
      - 'services/api/tools/check_admin_feed_item_materialization_contract.py'
      - 'docs/adr/0090-human-reviewed-feed-item-normalization-materialization.md'
      - 'docs/contracts/feed-item-normalization-slice54.v1.json'
      - 'docs/adr/0091-secured-admin-feed-item-materialization-command.md'
      - 'docs/contracts/admin-feed-item-materialization-slice55.v1.json'
      - '.github/workflows/feed-item-normalization-ci.yml'
      - '.github/workflows/admin-feed-item-materialization-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/knowledge_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/service.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_materialization.py'
      - 'services/api/src/kefe_api/modules/admin_security/editorial_projection_router.py'
      - 'services/api/src/kefe_api/modules/knowledge/models.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence.py'
      - 'services/api/src/kefe_api/modules/knowledge/in_memory.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_knowledge.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_orchestration.py'
      - 'services/api/tests/test_feed_item_normalization_materialization.py'
      - 'services/api/tests/test_feed_item_normalization_materialization_postgres.py'
      - 'services/api/tests/test_admin_feed_item_materialization*.py'
      - 'services/api/tools/check_feed_item_normalization_contract.py'
      - 'services/api/tools/check_admin_feed_item_materialization_contract.py'
      - 'docs/adr/0090-human-reviewed-feed-item-normalization-materialization.md'
      - 'docs/contracts/feed-item-normalization-slice54.v1.json'
      - 'docs/adr/0091-secured-admin-feed-item-materialization-command.md'
      - 'docs/contracts/admin-feed-item-materialization-slice55.v1.json'
      - '.github/workflows/feed-item-normalization-ci.yml'
      - '.github/workflows/admin-feed-item-materialization-ci.yml'

permissions:
  contents: read

jobs:
  feed-item-normalization-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff feed item normalization boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/ingestion_orchestration/knowledge_materializer.py
          tests/test_feed_item_normalization_materialization.py
          tests/test_feed_item_normalization_materialization_postgres.py
          tools/check_feed_item_normalization_contract.py
      - name: Feed item normalization architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_normalization_contract.py
      - name: Parent feed item extraction architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_extraction_contract.py
      - name: Parent ingestion orchestration architecture fitness
        working-directory: services/api
        run: python tools/check_ingestion_orchestration_contract.py
      - name: Feed item normalization memory behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_ingestion_orchestration.py
          tests/test_feed_item_normalization_materialization.py

  feed-item-normalization-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Feed item normalization PostgreSQL behavior
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_feed_item_normalization_materialization_postgres.py
