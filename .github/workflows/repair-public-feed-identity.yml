name: Repair Public Feed Identity

on:
  pull_request:
    paths:
      - '.github/workflows/repair-public-feed-identity.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate stable feed identity from versioned adapter identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'services/api/src/kefe_api/modules/knowledge/public_feed_runtime.py'
          )
          source = path.read_text(encoding='utf-8')
          old = (
              '    def __post_init__(self) -> None:\n'
              '        require_versioned_adapter_code(self.feed_code)\n'
              '        require_versioned_adapter_code(self.adapter_code)\n'
          )
          new = (
              '    def __post_init__(self) -> None:\n'
              '        require_versioned_adapter_code(self.adapter_code)\n'
          )
          if source.count(old) != 1:
              raise SystemExit('unexpected PublicFeedDefinition validation shape')
          source = source.replace(old, new, 1)
          old_get = (
              '    def get(self, feed_code: str) -> PublicFeedDefinition:\n'
              '        require_versioned_adapter_code(feed_code)\n'
          )
          new_get = (
              '    def get(self, feed_code: str) -> PublicFeedDefinition:\n'
              '        _require_exact_text(feed_code, "feed_code", MAX_FEED_CODE_CHARS)\n'
          )
          if source.count(old_get) != 1:
              raise SystemExit('unexpected feed registry lookup validation shape')
          source = source.replace(old_get, new_get, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Normalize and verify
        working-directory: services/api
        run: |
          python -m pip install -q ruff==0.11.10
          ruff format src/kefe_api/modules/knowledge/public_feed_runtime.py
          ruff check src/kefe_api/modules/knowledge/public_feed_runtime.py
          python -m py_compile src/kefe_api/modules/knowledge/public_feed_runtime.py
      - name: Remove repair workflow and commit
        run: |
          git rm -f .github/workflows/repair-public-feed-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/src/kefe_api/modules/knowledge/public_feed_runtime.py
          git commit -m 'fix: separate public-feed code from adapter version identity'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
