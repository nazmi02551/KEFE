name: Slice2 Finalize Fix

on:
  push:
    branches: [feature/premium-reveal-slice2]
    paths:
      - '.github/workflows/slice2-finalize-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-reveal-slice2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Remove extraction residue
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/features/decision/presentation/decision_flow_screen.dart')
          text = path.read_text(encoding='utf-8')
          target = "import '../../../core/localization/internal_alpha_strings.dart';\n"
          if target not in text:
              raise SystemExit('expected unused import not found')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Normalize Reveal slice sources and tests
        working-directory: apps/mobile
        run: >-
          dart format
          lib/features/decision/presentation/decision_flow_screen.dart
          lib/features/decision/presentation/reveal_result_card.dart
          test/premium_reveal_visual_test.dart
          test/premium_reveal_contract_test.dart
      - name: Commit source-only finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mobile/lib/features/decision/presentation/decision_flow_screen.dart \
            apps/mobile/lib/features/decision/presentation/reveal_result_card.dart \
            apps/mobile/test/premium_reveal_visual_test.dart \
            apps/mobile/test/premium_reveal_contract_test.dart
          if git diff --cached --quiet; then
            echo 'No finalization changes.'
            exit 0
          fi
          git commit -m 'fix: finalize premium Reveal slice sources'
          git push origin HEAD:feature/premium-reveal-slice2
