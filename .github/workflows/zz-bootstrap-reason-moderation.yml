name: Bootstrap Reason Moderation Contract

on:
  pull_request:
    paths:
      - "services/api/**"
      - "docs/contracts/**"
      - ".github/workflows/zz-bootstrap-reason-moderation.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-reason-moderation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Normalize and lint moderation slice
        working-directory: services/api
        run: >-
          ruff check --fix
          src/kefe_api/modules/community_reason
          src/kefe_api/infrastructure/postgres_community_reason.py
          src/kefe_api/modules/admin_security/models.py
          src/kefe_api/modules/admin_security/policy.py
          tests/test_admin_community_reason_moderation_http.py
          tests/test_admin_community_reason_moderation_http_postgres.py
          tools/check_admin_community_reason_moderation_contract.py
          tools/export_admin_community_reason_moderation_openapi_overlay.py
          tools/export_admin_publication_operations_openapi_overlay.py
          tools/export_openapi.py
          tools/export_mvp_openapi_overlay.py
          tools/export_global_openapi_overlay.py
      - name: Verify normalized moderation slice
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/community_reason
          src/kefe_api/infrastructure/postgres_community_reason.py
          src/kefe_api/modules/admin_security/models.py
          src/kefe_api/modules/admin_security/policy.py
          tests/test_admin_community_reason_moderation_http.py
          tests/test_admin_community_reason_moderation_http_postgres.py
          tools/check_admin_community_reason_moderation_contract.py
          tools/export_admin_community_reason_moderation_openapi_overlay.py
          tools/export_admin_publication_operations_openapi_overlay.py
          tools/export_openapi.py
          tools/export_mvp_openapi_overlay.py
          tools/export_global_openapi_overlay.py
      - name: Memory HTTP behavior
        working-directory: services/api
        run: pytest -q tests/test_admin_community_reason_moderation_http.py
      - name: Generate exact moderation overlay
        working-directory: services/api
        run: >-
          python tools/export_admin_community_reason_moderation_openapi_overlay.py
          --output ../../docs/contracts/openapi-admin-community-reason-moderation.v0.19.overlay.json
      - name: Commit exact bootstrap outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/api/src/kefe_api/infrastructure/postgres_community_reason.py \
            docs/contracts/openapi-admin-community-reason-moderation.v0.19.overlay.json
          if git diff --cached --quiet; then
            echo "Exact bootstrap outputs are already checked in."
            exit 0
          fi
          git commit -m "chore: check in exact reason moderation contracts"
          git push origin HEAD:${{ github.head_ref }}
