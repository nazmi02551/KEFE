name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_review_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py'
      - 'docs/contracts/canonical-admin-feed-source-brief-review.v1.json'
      - 'docs/contracts/connected-alpha-mobile-runtime.v1.json'
      - 'docs/contracts/raw-result-methodology-presentation.v1.json'
      - 'docs/contracts/raw-result-gap-interpretation.v1.json'
      - 'docs/contracts/connected-alpha-ci-consolidation.v1.json'
      - 'scripts/validate_connected_alpha_mobile_runtime.py'
      - 'scripts/validate_raw_result_methodology_presentation.py'
      - 'scripts/validate_raw_result_gap_interpretation.py'
      - 'scripts/validate_connected_alpha_ci_consolidation.py'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_review_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py'
      - 'docs/contracts/canonical-admin-feed-source-brief-review.v1.json'
      - 'docs/contracts/connected-alpha-mobile-runtime.v1.json'
      - 'docs/contracts/raw-result-methodology-presentation.v1.json'
      - 'docs/contracts/raw-result-gap-interpretation.v1.json'
      - 'docs/contracts/connected-alpha-ci-consolidation.v1.json'
      - 'scripts/validate_connected_alpha_mobile_runtime.py'
      - 'scripts/validate_raw_result_methodology_presentation.py'
      - 'scripts/validate_raw_result_gap_interpretation.py'
      - 'scripts/validate_connected_alpha_ci_consolidation.py'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Connected Alpha CI consolidation contract
        run: python3 scripts/validate_connected_alpha_ci_consolidation.py
      - name: Connected Alpha mobile runtime contract
        run: python3 scripts/validate_connected_alpha_mobile_runtime.py
      - name: RAW Result methodology presentation contract
        run: python3 scripts/validate_raw_result_methodology_presentation.py
      - name: RAW Result KEFE Gap interpretation contract
        run: python3 scripts/validate_raw_result_gap_interpretation.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Normalize formatting
        working-directory: apps/mobile
        run: dart format lib test
      - name: Analyze
        id: analyze
        continue-on-error: true
        working-directory: apps/mobile
        run: flutter analyze > analyze-output.txt 2>&1
      - name: Upload analyze diagnostics on failure
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-analyze-output
          path: apps/mobile/analyze-output.txt
          if-no-files-found: error
      - name: Enforce analyze
        if: always()
        run: test '${{ steps.analyze.outcome }}' = 'success'
      - name: Test
        id: tests
        continue-on-error: true
        working-directory: apps/mobile
        run: flutter test --reporter expanded > test-output.txt 2>&1
      - name: Upload test diagnostics on failure
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-output
          path: apps/mobile/test-output.txt
          if-no-files-found: error
      - name: Enforce tests
        if: always()
        run: test '${{ steps.tests.outcome }}' = 'success'
      - name: Generate transient Android host
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name kefe_mobile .
      - name: Compile Connected Alpha entrypoint without publishing it
        working-directory: apps/mobile
        run: >-
          flutter build apk --debug -t lib/main_connected_alpha.dart
          --dart-define=KEFE_API_BASE_URL=https://alpha-build-proof.example.com
          --dart-define=KEFE_HTTP_TIMEOUT_SECONDS=12
      - name: Enforce Connected Alpha compile-only artifact boundary
        working-directory: apps/mobile
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          rm -f build/app/outputs/flutter-apk/app-debug.apk
          echo "Connected Alpha compile proof completed; its APK is not uploaded."
      - name: Resolve preview identity
        id: preview_identity
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "version=v9-rc1" >> "$GITHUB_OUTPUT"
            echo "commit=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v9-internal" >> "$GITHUB_OUTPUT"
            echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build preview APK
        working-directory: apps/mobile
        run: >-
          flutter build apk --debug -t lib/main_preview.dart
          --dart-define=KEFE_PREVIEW_VERSION=${{ steps.preview_identity.outputs.version }}
          --dart-define=KEFE_PREVIEW_COMMIT=${{ steps.preview_identity.outputs.commit }}
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: kefe-preview-android
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
