name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Normalize formatting
        working-directory: apps/mobile
        run: dart format lib test
      - name: Analyze
        id: analyze
        continue-on-error: true
        working-directory: apps/mobile
        run: flutter analyze > analyze-output.txt 2>&1
      - name: Upload analyze diagnostics on failure
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-analyze-output
          path: apps/mobile/analyze-output.txt
          if-no-files-found: error
      - name: Enforce analyze
        if: always()
        run: test '${{ steps.analyze.outcome }}' = 'success'
      - name: Test
        id: tests
        continue-on-error: true
        working-directory: apps/mobile
        run: flutter test --reporter expanded > test-output.txt 2>&1
      - name: Upload test diagnostics on failure
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-output
          path: apps/mobile/test-output.txt
          if-no-files-found: error
      - name: Enforce tests
        if: always()
        run: test '${{ steps.tests.outcome }}' = 'success'
      - name: Generate transient Android host
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name kefe_mobile .
      - name: Build preview APK
        working-directory: apps/mobile
        run: >-
          flutter build apk --debug -t lib/main_preview.dart
          --dart-define=KEFE_PREVIEW_VERSION=v8
          --dart-define=KEFE_PREVIEW_COMMIT=${GITHUB_SHA}
      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: kefe-preview-android
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
