name: Wire Candidate Bundle API

on:
  pull_request:
    paths:
      - '.github/workflows/wire-candidate-bundle-api.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add API 0.25 router composition
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('services/api/src/kefe_api/main.py')
          source = path.read_text(encoding='utf-8')
          import_marker = (
              'from kefe_api.modules.admin_security.canonical_public_feed_router import (\n'
              '    router as admin_canonical_public_feed_router,\n'
              ')\n'
          )
          import_block = import_marker + (
              'from kefe_api.modules.admin_security.candidate_bundle_router import (\n'
              '    router as admin_candidate_bundle_router,\n'
              ')\n'
          )
          if source.count(import_marker) != 1:
              raise SystemExit('unexpected Admin router import marker')
          source = source.replace(import_marker, import_block, 1)
          pattern = re.compile(
              r'    if _api_at_least\(settings\.api_version, 0, 24\):\n'
              r'        app\.include_router\(admin_canonical_public_feed_router\)\n'
          )
          replacement = (
              '    if _api_at_least(settings.api_version, 0, 24):\n'
              '        app.include_router(admin_canonical_public_feed_router)\n'
              '    if _api_at_least(settings.api_version, 0, 25):\n'
              '        app.include_router(admin_candidate_bundle_router)\n'
          )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('unexpected API 0.24 route marker')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Normalize and verify
        working-directory: services/api
        run: |
          python -m pip install -q -U pip
          pip install -q -e '.[dev]'
          ruff check --fix \
            src/kefe_api/main.py \
            src/kefe_api/modules/admin_security/candidate_bundle.py \
            src/kefe_api/modules/admin_security/candidate_bundle_router.py
          ruff format \
            src/kefe_api/main.py \
            src/kefe_api/modules/admin_security/candidate_bundle.py \
            src/kefe_api/modules/admin_security/candidate_bundle_router.py
          ruff check \
            src/kefe_api/main.py \
            src/kefe_api/modules/admin_security/candidate_bundle.py \
            src/kefe_api/modules/admin_security/candidate_bundle_router.py
          python -m py_compile \
            src/kefe_api/main.py \
            src/kefe_api/modules/admin_security/candidate_bundle.py \
            src/kefe_api/modules/admin_security/candidate_bundle_router.py
          python tools/check_contract_sync.py
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/wire-candidate-bundle-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/api/src/kefe_api/main.py \
            services/api/src/kefe_api/modules/admin_security/candidate_bundle.py \
            services/api/src/kefe_api/modules/admin_security/candidate_bundle_router.py
          git commit -m 'feat: expose candidate bundle command in api 0.25'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
