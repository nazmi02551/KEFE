name: MVP Align Contract Once

on:
  push:
    branches:
      - feature/mvp-completion-beta-gate

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-completion-beta-gate
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API tooling
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Align executable contract checker with canonical MVP
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tools/check_contract_sync.py')
          source = path.read_text(encoding='utf-8')

          replacements = {
              '''            "primary_domain",\n            "decision",\n            "created_at",''': '''            "primary_domain",\n            "created_at",''',
              '''        {"actor_id", "private_reason", "reason_text", "confidence", "raw_response_payload"}\n        & share.keys()''': '''        {\n            "actor_id",\n            "decision",\n            "decision_snapshot",\n            "private_reason",\n            "reason_text",\n            "confidence",\n            "raw_response_payload",\n        }\n        & share.keys()''',
              '''        ("/v1/case-versions/{case_version_id}/community-reasons", "get"): (\n            "200",\n            "CommunityReasonSnapshotResponse",\n        ),''': '''        ("/v1/weigh-sessions/{session_id}/community-reasons", "get"): (\n            "200",\n            "CommunityReasonSnapshotResponse",\n        ),''',
              '''        ("/v1/shares/{token}", "get"),\n        ("/v1/case-versions/{case_version_id}/community-reasons", "get"),''': '''        ("/v1/shares/{token}", "get"),''',
              '''        ("/v1/weigh-sessions/{session_id}/community-reason", "post"),\n        ("/v1/community-reasons/{reason_id}/reaction", "put"),''': '''        ("/v1/weigh-sessions/{session_id}/community-reason", "post"),\n        ("/v1/weigh-sessions/{session_id}/community-reasons", "get"),\n        ("/v1/community-reasons/{reason_id}/reaction", "put"),''',
              '''        "commit_required: true",\n        "private_reason: forbidden",\n        "explicit_publication: true",''': '''        "commit_required: true",\n        "case_only: true",\n        "include_decision_true_error: SHARE_DECISION_EXPOSURE_NOT_SUPPORTED",\n        "sender_decision_public_payload: forbidden",\n        "sender_confidence_public_payload: forbidden",\n        "sender_private_reason_public_payload: forbidden",\n        "explicit_publication: true",\n        "read_requires_actor_owned_committed_session: true",\n        "public_case_version_read_route: forbidden",''',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected contract-check fragment not found: {old!r}')
              source = source.replace(old, new, 1)

          if '/v1/case-versions/{case_version_id}/community-reasons' in source:
              raise SystemExit('Legacy public Community Reason route remains in contract checker')
          path.write_text(source, encoding='utf-8')

          mobile = Path('apps/mobile/lib/features/community_reason/presentation/community_reason_section.dart')
          text = mobile.read_text(encoding='utf-8')
          old = '.load(widget.caseVersionId)'
          if old not in text:
              raise SystemExit('Expected Community Reason load target not found')
          mobile.write_text(text.replace(old, '.load(widget.sessionId)', 1), encoding='utf-8')
          PY
      - name: Normalize API sources
        working-directory: services/api
        run: >-
          ruff format
          src/kefe_api/modules/sharing/models.py
          src/kefe_api/modules/sharing/service.py
          src/kefe_api/modules/sharing/router.py
          src/kefe_api/modules/community_reason/service.py
          src/kefe_api/modules/community_reason/router.py
          tests/test_progress.py
          tests/test_mvp_completion.py
          tools/check_contract_sync.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Normalize changed mobile sources
        working-directory: apps/mobile
        run: >-
          dart format
          lib/features/sharing/data/share_repository.dart
          lib/features/sharing/data/http_share_repository.dart
          lib/features/sharing/application/share_controller.dart
          lib/features/sharing/presentation/share_section.dart
          lib/features/sharing/presentation/public_share_screen.dart
          lib/features/community_reason/data/community_reason_repository.dart
          lib/features/community_reason/data/http_community_reason_repository.dart
          lib/features/community_reason/application/community_reason_controller.dart
          lib/features/community_reason/presentation/community_reason_section.dart
          test/mvp_completion_contract_test.dart
      - name: Regenerate additive OpenAPI 0.19 overlay from runtime
        working-directory: services/api
        run: >-
          python tools/export_mvp_openapi_overlay.py
          --output ../../docs/contracts/openapi-mvp.v0.19.overlay.json
      - name: Verify composed OpenAPI exactness
        working-directory: services/api
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Remove one-shot workflow and commit alignment
        run: |
          git rm .github/workflows/mvp-align-contract-once.yml
          if git diff --quiet; then
            echo 'No alignment changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api apps/mobile docs/contracts/openapi-mvp.v0.19.overlay.json
          git commit -m 'fix: enforce canonical MVP share and community boundaries'
          git push origin HEAD:feature/mvp-completion-beta-gate
