name: Public Feed Activation CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/public_feed_activation.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_*.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_scheduler*.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/worker_*.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_public_feed_activation.py'
      - 'services/api/tools/check_public_feed_activation_contract.py'
      - 'docs/adr/0090-immutable-public-feed-activation-and-scheduled-capture-handoff.md'
      - 'docs/contracts/public-feed-activation-slice54.v1.json'
      - '.github/workflows/public-feed-activation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/public_feed_activation.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_*.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_scheduler*.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/worker_*.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_public_feed_activation.py'
      - 'services/api/tools/check_public_feed_activation_contract.py'
      - 'docs/adr/0090-immutable-public-feed-activation-and-scheduled-capture-handoff.md'
      - 'docs/contracts/public-feed-activation-slice54.v1.json'
      - '.github/workflows/public-feed-activation-ci.yml'

permissions:
  contents: read

jobs:
  public-feed-activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff public feed activation boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/public_feed_activation.py
          tests/test_public_feed_activation.py
          tools/check_public_feed_activation_contract.py
      - name: Public feed activation architecture fitness
        working-directory: services/api
        run: python tools/check_public_feed_activation_contract.py
      - name: Parent public provider architecture fitness
        working-directory: services/api
        run: python tools/check_public_provider_capture_contract.py
      - name: Parent provider admission architecture fitness
        working-directory: services/api
        run: python tools/check_provider_admission_control_contract.py
      - name: Parent provider HTTP transport architecture fitness
        working-directory: services/api
        run: python tools/check_provider_http_transport_contract.py
      - name: Parent RSS Atom architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_public_capture_contract.py
      - name: Parent feed item extraction architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_extraction_contract.py
      - name: Parent source scheduler architecture fitness
        working-directory: services/api
        run: python tools/check_source_acquisition_scheduler_contract.py
      - name: Parent ingestion worker architecture fitness
        working-directory: services/api
        run: python tools/check_ingestion_worker_runner_contract.py
      - name: Public feed activation behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_public_feed_activation.py
          tests/test_provider_http_transport.py
          tests/test_public_provider_capture.py
          tests/test_rss_atom_public_capture.py
          tests/test_source_acquisition_scheduler.py
          tests/test_feed_item_extraction.py
