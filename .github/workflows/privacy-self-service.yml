name: Privacy Self Service CI

on:
  pull_request:
    paths:
      - "services/api/src/kefe_api/modules/privacy/**"
      - "services/api/src/kefe_api/modules/identity/in_memory.py"
      - "services/api/src/kefe_api/infrastructure/postgres_privacy.py"
      - "services/api/migrations/versions/20260805_0029_privacy_self_service_hardening.py"
      - "services/api/tests/test_privacy_export_deletion_hardening.py"
      - "services/api/tests/test_privacy_export_deletion_hardening_postgres.py"
      - "services/api/tests/test_mvp_completion.py"
      - "services/api/tests/test_mvp_completion_postgres.py"
      - "services/api/tools/check_privacy_export_deletion_contract.py"
      - "services/api/tools/export_privacy_self_service_openapi.py"
      - "docs/adr/0108-deterministic-privacy-export-and-deletion-hardening.md"
      - "docs/contracts/privacy-export-deletion-hardening.v1.json"
      - "docs/contracts/openapi-privacy-self-service.v0.19.focused.json"
      - "docs/contracts/openapi-mvp.v0.19.overlay.json"
      - "docs/contracts/openapi-global.v0.20.overlay.json"
      - "docs/contracts/openapi.v1.json"
      - "apps/mobile/docs/privacy-self-service-cross-surface-boundary.md"
      - ".github/workflows/privacy-self-service.yml"
  push:
    branches: [main]
    paths:
      - "services/api/src/kefe_api/modules/privacy/**"
      - "services/api/src/kefe_api/modules/identity/in_memory.py"
      - "services/api/src/kefe_api/infrastructure/postgres_privacy.py"
      - "services/api/migrations/versions/20260805_0029_privacy_self_service_hardening.py"
      - "services/api/tests/test_privacy_export_deletion_hardening.py"
      - "services/api/tests/test_privacy_export_deletion_hardening_postgres.py"
      - "services/api/tests/test_mvp_completion.py"
      - "services/api/tests/test_mvp_completion_postgres.py"
      - "services/api/tools/check_privacy_export_deletion_contract.py"
      - "services/api/tools/export_privacy_self_service_openapi.py"
      - "docs/adr/0108-deterministic-privacy-export-and-deletion-hardening.md"
      - "docs/contracts/privacy-export-deletion-hardening.v1.json"
      - "docs/contracts/openapi-privacy-self-service.v0.19.focused.json"
      - "docs/contracts/openapi-mvp.v0.19.overlay.json"
      - "docs/contracts/openapi-global.v0.20.overlay.json"
      - "docs/contracts/openapi.v1.json"
      - "apps/mobile/docs/privacy-self-service-cross-surface-boundary.md"
      - ".github/workflows/privacy-self-service.yml"

permissions:
  contents: read

concurrency:
  group: privacy-self-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint privacy slice
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/privacy
          src/kefe_api/modules/identity/in_memory.py
          src/kefe_api/infrastructure/postgres_privacy.py
          migrations/versions/20260805_0029_privacy_self_service_hardening.py
          tests/test_privacy_export_deletion_hardening.py
          tests/test_privacy_export_deletion_hardening_postgres.py
          tests/test_mvp_completion.py
          tests/test_mvp_completion_postgres.py
          tools/check_privacy_export_deletion_contract.py
          tools/export_privacy_self_service_openapi.py
      - name: Executable privacy architecture contract
        working-directory: services/api
        run: python tools/check_privacy_export_deletion_contract.py
      - name: Exact focused privacy OpenAPI
        working-directory: services/api
        run: >-
          python tools/export_privacy_self_service_openapi.py
          --output ../../docs/contracts/openapi-privacy-self-service.v0.19.focused.json
          --check
      - name: Exact MVP 0.19 overlay
        working-directory: services/api
        run: >-
          python tools/export_mvp_openapi_overlay.py
          --output ../../docs/contracts/openapi-mvp.v0.19.overlay.json
          --check
      - name: Exact composed OpenAPI
        working-directory: services/api
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Exact Global 0.20 overlay
        working-directory: services/api
        run: >-
          python tools/export_global_openapi_overlay.py
          --output ../../docs/contracts/openapi-global.v0.20.overlay.json
          --check
      - name: Memory deterministic export and actor-bound deletion proof
        working-directory: services/api
        run: >-
          pytest -q
          tests/test_privacy_export_deletion_hardening.py
          tests/test_mvp_completion.py

  postgres:
    needs: api-memory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Seed canonical fixtures
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: |
          python -m kefe_api.infrastructure.seed_demo
          python -m kefe_api.infrastructure.seed_context_demo
          python -m kefe_api.infrastructure.seed_beta_catalog
      - name: Restart concurrency catalog and append-only proof
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_PERSISTENCE_BACKEND: postgres
          KEFE_RUN_POSTGRES_TESTS: "1"
        run: >-
          pytest -q
          tests/test_privacy_export_deletion_hardening_postgres.py
          tests/test_mvp_completion_postgres.py
