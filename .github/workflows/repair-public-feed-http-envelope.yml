name: Repair Public Feed HTTP Envelope

on:
  pull_request:
    paths:
      - '.github/workflows/repair-public-feed-http-envelope.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Use the existing FastAPI CSRF error envelope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/test_canonical_public_feed_http.py')
          source = path.read_text(encoding='utf-8')
          old = 'assert missing_csrf.json()["error"]["code"] == "ADMIN_CSRF_REQUIRED"'
          new = 'assert missing_csrf.json()["detail"]["code"] == "ADMIN_CSRF_REQUIRED"'
          if source.count(old) != 1:
              raise SystemExit('unexpected CSRF assertion shape')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/repair-public-feed-http-envelope.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tests/test_canonical_public_feed_http.py
          git commit -m 'test: align canonical public-feed CSRF envelope'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
