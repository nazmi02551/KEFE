name: Reconcile M2 Contract Checker

on:
  pull_request:
    paths:
      - '.github/workflows/reconcile-m2-reflection-authority.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 62
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Align contract checker with API 0.15.0
        run: |
          python - <<'PY'
          from pathlib import Path
          checker = Path('services/api/tools/check_contract_sync.py')
          text = checker.read_text(encoding='utf-8')
          text = text.replace('0.14.0', '0.15.0')
          checker.write_text(text, encoding='utf-8')
          PY
      - name: Commit checker reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tools/check_contract_sync.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Align contract checker with API 0.15.0'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
