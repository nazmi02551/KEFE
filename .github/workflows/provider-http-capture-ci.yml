name: Provider HTTP Capture CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_auth.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_transport.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_secret_execution.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_provider_http_capture*.py'
      - 'services/api/tools/check_provider_http_capture_contract.py'
      - 'docs/adr/0084-provider-neutral-http-capture-adapter-and-bounded-response-parsing.md'
      - 'docs/contracts/provider-http-capture-slice48.v1.json'
      - '.github/workflows/provider-http-capture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_auth.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_transport.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_secret_execution.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_provider_http_capture*.py'
      - 'services/api/tools/check_provider_http_capture_contract.py'
      - 'docs/adr/0084-provider-neutral-http-capture-adapter-and-bounded-response-parsing.md'
      - 'docs/contracts/provider-http-capture-slice48.v1.json'
      - '.github/workflows/provider-http-capture-ci.yml'

permissions:
  contents: read

jobs:
  provider-http-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff provider HTTP capture boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/provider_http_capture.py
          src/kefe_api/modules/knowledge/provider_http_auth.py
          src/kefe_api/modules/knowledge/provider_http_transport.py
          src/kefe_api/modules/knowledge/provider_secret_execution.py
          src/kefe_api/modules/knowledge/source_acquisition.py
          src/kefe_api/infrastructure/editorial_pipeline.py
          tests/test_provider_http_capture.py
          tests/test_provider_http_capture_architecture.py
          tools/check_provider_http_capture_contract.py
      - name: Provider HTTP capture architecture fitness
        working-directory: services/api
        run: python tools/check_provider_http_capture_contract.py
      - name: Provider HTTP capture behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_provider_http_capture.py
          tests/test_provider_http_capture_architecture.py
