name: Admin Feed Item Review CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/proposal_queue.py'
      - 'services/api/src/kefe_api/modules/admin_security/proposal_queue_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/knowledge/models.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_admin_feed_item_review_http.py'
      - 'services/api/tests/test_admin_feed_item_review_http_postgres.py'
      - 'services/api/tests/test_admin_proposal_queue_http.py'
      - 'services/api/tests/test_admin_proposal_queue_http_postgres.py'
      - 'services/api/tools/check_admin_feed_item_review_contract.py'
      - 'services/api/tools/check_admin_proposal_queue_contract.py'
      - 'services/api/tools/check_feed_item_extraction_contract.py'
      - 'docs/adr/0090-evidence-safe-admin-feed-item-review-surface.md'
      - 'docs/contracts/admin-feed-item-review-slice54.v1.json'
      - '.github/workflows/admin-feed-item-review-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/proposal_queue.py'
      - 'services/api/src/kefe_api/modules/admin_security/proposal_queue_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/knowledge/models.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_admin_feed_item_review_http.py'
      - 'services/api/tests/test_admin_feed_item_review_http_postgres.py'
      - 'services/api/tests/test_admin_proposal_queue_http.py'
      - 'services/api/tests/test_admin_proposal_queue_http_postgres.py'
      - 'services/api/tools/check_admin_feed_item_review_contract.py'
      - 'services/api/tools/check_admin_proposal_queue_contract.py'
      - 'services/api/tools/check_feed_item_extraction_contract.py'
      - 'docs/adr/0090-evidence-safe-admin-feed-item-review-surface.md'
      - 'docs/contracts/admin-feed-item-review-slice54.v1.json'
      - '.github/workflows/admin-feed-item-review-ci.yml'

permissions:
  contents: read

jobs:
  admin-feed-item-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff Admin feed item boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/admin_security/feed_item_review.py
          src/kefe_api/modules/admin_security/feed_item_review_router.py
          tests/test_admin_feed_item_review_http.py
          tests/test_admin_feed_item_review_http_postgres.py
          tools/check_admin_feed_item_review_contract.py
      - name: Admin feed item review architecture and OpenAPI fitness
        working-directory: services/api
        run: python tools/check_admin_feed_item_review_contract.py
      - name: Parent feed item extraction architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_extraction_contract.py
      - name: Parent Admin Proposal queue architecture fitness
        working-directory: services/api
        run: python tools/check_admin_proposal_queue_contract.py
      - name: Admin feed item review memory HTTP
        working-directory: services/api
        run: >-
          pytest
          tests/test_admin_feed_item_review_http.py
          tests/test_admin_proposal_queue_http.py

  admin-feed-item-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Admin feed item review PostgreSQL HTTP
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_admin_feed_item_review_http_postgres.py
          tests/test_admin_proposal_queue_http_postgres.py
