name: RSS Atom Public Capture CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_public_http_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_public_execution.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_*.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence*.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_rss_atom_public_capture*.py'
      - 'services/api/tools/check_rss_atom_public_capture_contract.py'
      - 'docs/adr/0088-strict-rss-atom-parsing-and-evidence-backed-public-http-capture.md'
      - 'docs/contracts/rss-atom-public-capture-slice52.v1.json'
      - '.github/workflows/rss-atom-public-capture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_public_http_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_public_execution.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_http_*.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence*.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_rss_atom_public_capture*.py'
      - 'services/api/tools/check_rss_atom_public_capture_contract.py'
      - 'docs/adr/0088-strict-rss-atom-parsing-and-evidence-backed-public-http-capture.md'
      - 'docs/contracts/rss-atom-public-capture-slice52.v1.json'
      - '.github/workflows/rss-atom-public-capture-ci.yml'

permissions:
  contents: read

jobs:
  rss-atom-public-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff RSS Atom public capture boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/provider_public_http_capture.py
          src/kefe_api/modules/knowledge/rss_atom_capture.py
          tests/test_rss_atom_public_capture.py
          tests/test_rss_atom_public_capture_architecture.py
          tools/check_rss_atom_public_capture_contract.py
      - name: RSS Atom public capture architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_public_capture_contract.py
      - name: Parent public provider capture architecture fitness
        working-directory: services/api
        run: python tools/check_public_provider_capture_contract.py
      - name: Parent raw evidence architecture fitness
        working-directory: services/api
        run: python tools/check_raw_source_evidence_contract.py
      - name: RSS Atom public capture behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_rss_atom_public_capture.py
          tests/test_rss_atom_public_capture_architecture.py
