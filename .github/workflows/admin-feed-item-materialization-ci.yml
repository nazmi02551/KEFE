name: Admin Feed Item Materialization CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_materialization*.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/service.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tools/export_admin_feed_item_materialization_openapi_overlay.py'
      - 'services/api/tools/export_openapi.py'
      - 'services/api/tools/check_admin_feed_item_materialization_http_contract.py'
      - 'services/api/tests/test_admin_feed_item_materialization*.py'
      - 'docs/adr/0093-secured-admin-feed-item-materialization-http-operation.md'
      - 'docs/contracts/admin-feed-item-materialization-http-slice57.v1.json'
      - 'docs/contracts/openapi-admin-feed-item-materialization.v0.19.overlay.json'
      - '.github/workflows/admin-feed-item-materialization-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_materialization*.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/service.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tools/export_admin_feed_item_materialization_openapi_overlay.py'
      - 'services/api/tools/export_openapi.py'
      - 'services/api/tools/check_admin_feed_item_materialization_http_contract.py'
      - 'services/api/tests/test_admin_feed_item_materialization*.py'
      - 'docs/adr/0093-secured-admin-feed-item-materialization-http-operation.md'
      - 'docs/contracts/admin-feed-item-materialization-http-slice57.v1.json'
      - 'docs/contracts/openapi-admin-feed-item-materialization.v0.19.overlay.json'
      - '.github/workflows/admin-feed-item-materialization-ci.yml'

permissions:
  contents: read

jobs:
  admin-feed-item-materialization-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff Admin feed item materialization boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/admin_security/feed_item_materialization.py
          src/kefe_api/modules/admin_security/feed_item_materialization_router.py
          tests/test_admin_feed_item_materialization_http.py
          tests/test_admin_feed_item_materialization_architecture.py
          tools/check_admin_feed_item_materialization_http_contract.py
          tools/export_admin_feed_item_materialization_openapi_overlay.py
      - name: Admin feed item materialization architecture fitness
        working-directory: services/api
        run: python tools/check_admin_feed_item_materialization_http_contract.py
      - name: Parent Admin HTTP architecture fitness
        working-directory: services/api
        run: python tools/check_admin_http_contract.py
      - name: Parent Admin editorial operations architecture fitness
        working-directory: services/api
        run: python tools/check_admin_projection_http_contract.py
      - name: Parent ingestion orchestration architecture fitness
        working-directory: services/api
        run: python tools/check_ingestion_orchestration_contract.py
      - name: Parent feed item materialization architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_materialization_contract.py
      - name: Admin feed item materialization OpenAPI exact gate
        working-directory: services/api
        run: >-
          python tools/export_admin_feed_item_materialization_openapi_overlay.py
          --output ../../docs/contracts/openapi-admin-feed-item-materialization.v0.19.overlay.json
          --check
      - name: Admin feed item materialization HTTP behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_admin_editorial_operations_http.py
          tests/test_feed_item_materializer.py
          tests/test_admin_feed_item_materialization_http.py

  admin-feed-item-materialization-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Admin feed item materialization PostgreSQL HTTP
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_ingestion_orchestration_postgres.py
          tests/test_feed_item_materializer_postgres.py
          tests/test_admin_feed_item_materialization_http_postgres.py
