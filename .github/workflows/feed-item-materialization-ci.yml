name: Feed Item Materialization CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/knowledge_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/service.py'
      - 'services/api/src/kefe_api/modules/knowledge/**'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_knowledge.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_orchestration.py'
      - 'services/api/tests/test_feed_item_materializer*.py'
      - 'services/api/tools/check_feed_item_materialization_contract.py'
      - 'docs/adr/0092-human-approved-feed-item-materialization-into-immutable-normalized-artifact.md'
      - 'docs/contracts/feed-item-materialization-slice56.v1.json'
      - '.github/workflows/feed-item-materialization-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/feed_item_extraction.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/knowledge_materializer.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/service.py'
      - 'services/api/src/kefe_api/modules/knowledge/**'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_knowledge.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_ingestion_orchestration.py'
      - 'services/api/tests/test_feed_item_materializer*.py'
      - 'services/api/tools/check_feed_item_materialization_contract.py'
      - 'docs/adr/0092-human-approved-feed-item-materialization-into-immutable-normalized-artifact.md'
      - 'docs/contracts/feed-item-materialization-slice56.v1.json'
      - '.github/workflows/feed-item-materialization-ci.yml'

permissions:
  contents: read

jobs:
  feed-item-materialization-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff feed item materialization boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/ingestion_orchestration/feed_item_materializer.py
          tests/test_feed_item_materializer.py
          tests/test_feed_item_materialization_architecture.py
          tools/check_feed_item_materialization_contract.py
      - name: Feed item materialization architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_materialization_contract.py
      - name: Parent ingestion orchestration architecture fitness
        working-directory: services/api
        run: python tools/check_ingestion_orchestration_contract.py
      - name: Parent feed item extraction architecture fitness
        working-directory: services/api
        run: python tools/check_feed_item_extraction_contract.py
      - name: Parent RSS Atom route architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_route_contract.py
      - name: Feed item materialization behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_ingestion_orchestration.py
          tests/test_feed_item_extraction.py
          tests/test_feed_item_materializer.py

  feed-item-materialization-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Feed item materialization PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_ingestion_orchestration_postgres.py
          tests/test_knowledge_graph_postgres.py
          tests/test_feed_item_materializer_postgres.py
