name: Public Feed Runtime CI

on:
  pull_request:
    paths:
      - "services/api/src/kefe_api/modules/knowledge/public_feed_runtime.py"
      - "services/api/tests/test_public_feed_runtime.py"
      - "services/api/tests/test_public_feed_runtime_architecture.py"
      - "services/api/tools/check_public_feed_runtime_contract.py"
      - "docs/adr/0090-validated-public-feed-definitions-and-manual-capture-runtime.md"
      - "docs/contracts/public-feed-runtime-slice54.v1.json"
      - ".github/workflows/public-feed-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-feed-runtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff public feed runtime boundary
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/public_feed_runtime.py
          tests/test_public_feed_runtime.py
          tests/test_public_feed_runtime_architecture.py
          tools/check_public_feed_runtime_contract.py
      - name: Public feed runtime architecture fitness
        run: python tools/check_public_feed_runtime_contract.py
      - name: Parent feed item extraction architecture fitness
        run: python tools/check_feed_item_extraction_contract.py
      - name: Parent RSS Atom architecture fitness
        run: python tools/check_rss_atom_public_capture_contract.py
      - name: Parent public provider capture architecture fitness
        run: python tools/check_public_provider_capture_contract.py
      - name: Parent raw evidence architecture fitness
        run: python tools/check_raw_source_evidence_contract.py
      - name: Parent durable evidence architecture fitness
        run: python tools/check_durable_raw_evidence_backend_contract.py
      - name: Parent ingestion worker architecture fitness
        run: python tools/check_ingestion_worker_runner_contract.py
      - name: Public feed runtime behavior
        run: >-
          pytest
          tests/test_public_feed_runtime.py
          tests/test_feed_item_extraction.py
          tests/test_source_evidence_reading.py
