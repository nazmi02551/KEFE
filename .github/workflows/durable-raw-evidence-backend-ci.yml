name: Durable Raw Evidence Backend CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence_backend.py'
      - 'services/api/src/kefe_api/infrastructure/raw_evidence_runtime.py'
      - 'services/api/src/kefe_api/core/settings.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_source_evidence_backend.py'
      - 'services/api/tests/test_raw_evidence_runtime.py'
      - 'services/api/tests/test_durable_raw_evidence_backend_architecture.py'
      - 'services/api/tools/check_durable_raw_evidence_backend_contract.py'
      - 'docs/adr/0086-durable-raw-evidence-backend-capability-and-no-fallback-runtime.md'
      - 'docs/contracts/durable-raw-evidence-backend-slice50.v1.json'
      - '.github/workflows/durable-raw-evidence-backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_evidence_backend.py'
      - 'services/api/src/kefe_api/infrastructure/raw_evidence_runtime.py'
      - 'services/api/src/kefe_api/core/settings.py'
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/tests/test_source_evidence_backend.py'
      - 'services/api/tests/test_raw_evidence_runtime.py'
      - 'services/api/tests/test_durable_raw_evidence_backend_architecture.py'
      - 'services/api/tools/check_durable_raw_evidence_backend_contract.py'
      - 'docs/adr/0086-durable-raw-evidence-backend-capability-and-no-fallback-runtime.md'
      - 'docs/contracts/durable-raw-evidence-backend-slice50.v1.json'
      - '.github/workflows/durable-raw-evidence-backend-ci.yml'

permissions:
  contents: read

jobs:
  durable-raw-evidence-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff durable raw evidence backend boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/source_evidence.py
          src/kefe_api/modules/knowledge/source_evidence_backend.py
          src/kefe_api/infrastructure/raw_evidence_runtime.py
          src/kefe_api/core/settings.py
          src/kefe_api/main.py
          tests/test_source_evidence_backend.py
          tests/test_raw_evidence_runtime.py
          tests/test_durable_raw_evidence_backend_architecture.py
          tools/check_durable_raw_evidence_backend_contract.py
      - name: Durable raw evidence backend architecture fitness
        working-directory: services/api
        run: python tools/check_durable_raw_evidence_backend_contract.py
      - name: Durable raw evidence backend behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_source_evidence_backend.py
          tests/test_raw_evidence_runtime.py
          tests/test_durable_raw_evidence_backend_architecture.py
