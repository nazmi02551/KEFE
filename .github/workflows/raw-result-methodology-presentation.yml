name: RAW Result Methodology Presentation CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/lib/core/localization/result_methodology_string_catalog.dart'
      - 'apps/mobile/lib/core/localization/result_methodology_strings.dart'
      - 'apps/mobile/lib/features/decision/presentation/reveal_result_card.dart'
      - 'apps/mobile/test/raw_result_methodology_copy_test.dart'
      - 'docs/contracts/raw-result-methodology-presentation.v1.json'
      - 'docs/adr/0127-layer-aware-result-methodology-presentation.md'
      - 'docs/status/F4_RAW_RESULT_METHODOLOGY_PRESENTATION_2026-08-09.md'
      - 'scripts/validate_raw_result_methodology_presentation.py'
      - '.github/workflows/raw-result-methodology-presentation.yml'
  push:
    branches:
      - main
      - feature/f4-raw-result-methodology-copy
    paths:
      - 'apps/mobile/lib/core/localization/result_methodology_string_catalog.dart'
      - 'apps/mobile/lib/core/localization/result_methodology_strings.dart'
      - 'apps/mobile/lib/features/decision/presentation/reveal_result_card.dart'
      - 'apps/mobile/test/raw_result_methodology_copy_test.dart'
      - 'docs/contracts/raw-result-methodology-presentation.v1.json'
      - 'docs/adr/0127-layer-aware-result-methodology-presentation.md'
      - 'docs/status/F4_RAW_RESULT_METHODOLOGY_PRESENTATION_2026-08-09.md'
      - 'scripts/validate_raw_result_methodology_presentation.py'
      - '.github/workflows/raw-result-methodology-presentation.yml'

permissions:
  contents: read

concurrency:
  group: raw-result-methodology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-copy-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Validate contract JSON
        run: python -m json.tool docs/contracts/raw-result-methodology-presentation.v1.json >/dev/null

      - name: Executable presentation contract
        run: python scripts/validate_raw_result_methodology_presentation.py

      - name: Resolve mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Enforce focused Dart formatting
        working-directory: apps/mobile
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/core/localization/result_methodology_string_catalog.dart
          lib/core/localization/result_methodology_strings.dart
          lib/features/decision/presentation/reveal_result_card.dart
          test/raw_result_methodology_copy_test.dart

      - name: Analyze mobile package
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test layer-aware Result methodology copy
        working-directory: apps/mobile
        run: flutter test --reporter expanded test/raw_result_methodology_copy_test.dart

      - name: Preserve methodology boundary
        run: >-
          echo "RAW presentation is observed committed participation only; this CI does not
          establish representativeness, statistical confidence, Signal, Impact, human
          usability, store readiness or F4 completion."
