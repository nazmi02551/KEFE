name: Format Contract Check PR85

on:
  push:
    branches:
      - feature/my-kefe-journey-api

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-kefe-journey-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format fitness gate
        run: |
          python -m pip install -q ruff
          ruff format services/api/tools/check_contract_sync.py
          rm .github/workflows/format-contract-check-pr85.yml
      - name: Commit formatted gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tools/check_contract_sync.py .github/workflows/format-contract-check-pr85.yml
          git commit -m 'Format My KEFE journey contract fitness gate'
          git push origin HEAD:feature/my-kefe-journey-api
