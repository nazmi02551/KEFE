name: Integrate Public Feed Runtime Rehydration

on:
  pull_request:
    paths:
      - '.github/workflows/integrate-public-feed-rehydration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add deterministic runtime-profile rehydration
        run: |
          python - <<'PY'
          from pathlib import Path

          domain_path = Path(
              'services/api/src/kefe_api/modules/knowledge/'
              'canonical_public_feed_catalog.py'
          )
          domain = domain_path.read_text(encoding='utf-8')
          marker = '    def list_definitions(\n'
          if domain.count(marker) != 1:
              raise SystemExit('unexpected list_definitions insertion point')
          method = '''    def rehydrate_runtime_profiles(self) -> tuple[str, ...]:
              adapter_codes: list[str] = []
              for definition in self._repository.list_definitions():
                  activation = self._repository.get_activation_for_definition(
                      definition.id
                  )
                  if (
                      activation is None
                      or activation.state is PublicFeedActivationState.RETIRED
                  ):
                      continue
                  if definition.state is not PublicFeedCatalogState.APPROVED:
                      raise RuntimeError(
                          "active public-feed projection requires APPROVED definition"
                      )
                  profile = self._build_runtime_profile(definition)
                  if (
                      profile.configuration_hash != activation.configuration_hash
                      or profile.adoption_profile.adapter_code
                      != activation.adapter_code
                  ):
                      raise RuntimeError(
                          "persisted public-feed activation identity drifted"
                      )
                  self._runtime_profiles.register_or_get(profile)
                  adapter_codes.append(activation.adapter_code)
              return tuple(sorted(adapter_codes))

          '''
          domain = domain.replace(marker, method + marker, 1)
          domain_path.write_text(domain, encoding='utf-8')

          composition_path = Path(
              'services/api/src/kefe_api/infrastructure/'
              'canonical_public_feed_composition.py'
          )
          composition = composition_path.read_text(encoding='utf-8')
          old = '''    service = CanonicalPublicFeedCatalogService(
              repository=repository,
              security=admin_security_service,
              provider_admission=editorial_pipeline.source_provider_admission_service,
              runtime_profiles=runtime_profiles,
              scheduler=editorial_pipeline.source_scheduler_service,
          )
              return CanonicalPublicFeedComposition(
          '''
          new = '''    service = CanonicalPublicFeedCatalogService(
              repository=repository,
              security=admin_security_service,
              provider_admission=editorial_pipeline.source_provider_admission_service,
              runtime_profiles=runtime_profiles,
              scheduler=editorial_pipeline.source_scheduler_service,
          )
              service.rehydrate_runtime_profiles()
              return CanonicalPublicFeedComposition(
          '''
          if composition.count(old) != 1:
              raise SystemExit('unexpected composition service block')
          composition_path.write_text(
              composition.replace(old, new, 1),
              encoding='utf-8',
          )
          PY
      - name: Normalize and verify
        working-directory: services/api
        run: |
          python -m pip install -q ruff==0.11.10
          ruff format \
            src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            src/kefe_api/infrastructure/canonical_public_feed_composition.py
          ruff check \
            src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            src/kefe_api/infrastructure/canonical_public_feed_composition.py
          python -m py_compile \
            src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            src/kefe_api/infrastructure/canonical_public_feed_composition.py
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/integrate-public-feed-rehydration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/src/kefe_api/infrastructure/canonical_public_feed_composition.py
          git commit -m 'feat: rehydrate approved public-feed runtime profiles'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
