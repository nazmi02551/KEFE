name: Bootstrap OTP Alert Operational Overlay

on:
  pull_request:
    paths:
      - ".github/workflows/_bootstrap-otp-alert-operational-overlay.yml"
      - "services/api/tools/export_admin_operational_reports_openapi_overlay.py"
      - "services/api/src/kefe_api/modules/admin_security/operational_reports_router.py"
      - "docs/contracts/openapi-admin-operational-reports.v0.19.overlay.json"

permissions:
  contents: write

concurrency:
  group: bootstrap-otp-alert-operational-overlay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Generate Operational Reports overlay
        working-directory: services/api
        run: >-
          python tools/export_admin_operational_reports_openapi_overlay.py
          --output ../../docs/contracts/openapi-admin-operational-reports.v0.19.overlay.json
      - name: Commit exact generated overlay
        run: |
          if git diff --quiet -- docs/contracts/openapi-admin-operational-reports.v0.19.overlay.json; then
            echo "Operational Reports overlay already matches runtime."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contracts/openapi-admin-operational-reports.v0.19.overlay.json
          git commit -m "docs(api): sync OTP alert Operational Reports overlay"
          git push origin HEAD:${{ github.head_ref }}
