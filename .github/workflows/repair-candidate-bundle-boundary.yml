name: Repair Candidate Bundle Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/repair-candidate-bundle-boundary.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify neutral ingestion boundary and refresh session fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          domain_path = Path(
              'services/api/src/kefe_api/modules/ingestion_orchestration/'
              'candidate_case_bundle.py'
          )
          source = domain_path.read_text(encoding='utf-8')
          for forbidden in ('content_authoring', 'MarketScope'):
              if forbidden in source:
                  raise SystemExit(f'forbidden ingestion dependency remains: {forbidden}')
          for marker in (
              'market_scope: str',
              'self.market_scope not in {',
              '"GLOBAL"',
              '"COUNTRY_SET"',
              '"market_scope": self.market_scope',
              'market_scope=value["market_scope"]',
          ):
              if marker not in source:
                  raise SystemExit(f'neutral market-scope marker missing: {marker}')

          test_path = Path('services/api/tests/test_canonical_public_feed_vertical.py')
          test_source = test_path.read_text(encoding='utf-8')
          old = '''def _principal(role: AdminRole) -> AdminPrincipal:
              return AdminPrincipal(
                  admin_subject_id=uuid4(),
                  session_id=uuid4(),
                  roles=frozenset({role}),
                  direct_capabilities=frozenset(),
                  authenticated_at=NOW - timedelta(minutes=5),
                  mfa_satisfied_at=NOW - timedelta(minutes=5),
                  step_up_at=NOW - timedelta(minutes=1),
                  expires_at=NOW + timedelta(hours=2),
                  last_seen_at=NOW - timedelta(minutes=1),
              )
          '''
          new = '''def _principal(role: AdminRole) -> AdminPrincipal:
              session_now = datetime.now(UTC)
              return AdminPrincipal(
                  admin_subject_id=uuid4(),
                  session_id=uuid4(),
                  roles=frozenset({role}),
                  direct_capabilities=frozenset(),
                  authenticated_at=session_now - timedelta(minutes=5),
                  mfa_satisfied_at=session_now - timedelta(minutes=5),
                  step_up_at=session_now - timedelta(minutes=1),
                  expires_at=session_now + timedelta(hours=2),
                  last_seen_at=session_now - timedelta(minutes=1),
              )
          '''
          if test_source.count(old) != 1:
              raise SystemExit('unexpected public-feed principal fixture')
          test_path.write_text(test_source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Normalize and verify targeted behavior
        working-directory: services/api
        run: |
          python -m pip install -q -U pip
          pip install -q -e '.[dev]'
          ruff format tests/test_canonical_public_feed_vertical.py
          ruff check \
            src/kefe_api/modules/ingestion_orchestration/candidate_case_bundle.py \
            tests/test_canonical_public_feed_vertical.py
          python -m py_compile \
            src/kefe_api/modules/ingestion_orchestration/candidate_case_bundle.py \
            tests/test_canonical_public_feed_vertical.py
          python tools/check_ingestion_orchestration_contract.py
          pytest -q \
            tests/test_canonical_public_feed_vertical.py \
            tests/test_canonical_candidate_bundle_projection_http.py
      - name: Remove workflow and commit
        run: |
          git rm -f .github/workflows/repair-candidate-bundle-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tests/test_canonical_public_feed_vertical.py
          git commit -m 'fix: keep canonical session fixtures current'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
