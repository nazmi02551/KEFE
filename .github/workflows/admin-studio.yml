name: Admin Studio CI

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "docs/adr/0100-secured-admin-studio-editorial-workspace.md"
      - "docs/contracts/admin-studio-editorial-workspace.v1.json"
      - ".github/workflows/admin-studio.yml"
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "docs/adr/0100-secured-admin-studio-editorial-workspace.md"
      - "docs/contracts/admin-studio-editorial-workspace.v1.json"
      - ".github/workflows/admin-studio.yml"

permissions:
  contents: write

concurrency:
  group: admin-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-branch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-studio-editorial-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Correct the post-bundle navigation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/admin/src/components/editorial-workspace.tsx")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'<button\s+onClick=\{\(\) => setStage\("REVIEW"\)\}\s+type="button">\s*'
              r'İş listesine dönüp ayrı ayrı incele\s*</button>',
              re.MULTILINE,
          )
          replacement = '''<button onClick={() => setStage("QUEUE")} type="button">
                İş listesine dönüp ayrı ayrı incele
              </button>'''
          source, changed = pattern.subn(replacement, source, count=1)
          if changed == 0 and 'setStage("QUEUE")' not in source:
              raise SystemExit("post-bundle navigation block drifted")
          path.write_text(source, encoding="utf-8")
          PY
      - name: Generate deterministic dependency lock
        working-directory: apps/admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove superseded and temporary files
        run: |
          rm -f apps/admin/.eslintrc.json
          rm -f .github/workflows/admin-studio-finalize.yml
      - name: Commit bounded finalization when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin .github/workflows/admin-studio-finalize.yml
          if git diff --cached --quiet; then
            echo "Branch already finalized"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(admin): finalize deterministic workspace branch"
          git push origin HEAD:feature/admin-studio-editorial-workspace

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund
      - name: Verify executable contract, lint, types, tests and production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run verify
