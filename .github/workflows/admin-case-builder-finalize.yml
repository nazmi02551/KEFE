name: Finalize Admin Case Builder contract

on:
  pull_request:
    paths:
      - ".github/workflows/admin-case-builder-finalize.yml"
      - "services/api/src/kefe_api/modules/admin_security/case_builder_router.py"
      - "services/api/tests/test_admin_case_builder_http.py"
      - "services/api/tests/test_admin_case_builder_http_postgres.py"
      - "services/api/tools/export_admin_case_builder_openapi_overlay.py"
      - "services/api/tools/export_openapi.py"

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.ref == 'feature/admin-case-builder-draft-workspace' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-case-builder-draft-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API tooling
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Normalize bounded Python slice
        working-directory: services/api
        run: >-
          ruff format
          src/kefe_api/modules/admin_security/case_builder_router.py
          tests/test_admin_case_builder_http.py
          tests/test_admin_case_builder_http_postgres.py
          tools/check_admin_case_builder_contract.py
          tools/export_admin_case_builder_openapi_overlay.py
      - name: Generate exact additive OpenAPI overlay
        working-directory: services/api
        run: >-
          python tools/export_admin_case_builder_openapi_overlay.py
          --output ../../docs/contracts/openapi-admin-case-builder.v0.19.overlay.json
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/admin-case-builder-finalize.yml
      - name: Commit deterministic contract artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/api/src/kefe_api/modules/admin_security/case_builder_router.py \
            services/api/tests/test_admin_case_builder_http.py \
            services/api/tests/test_admin_case_builder_http_postgres.py \
            services/api/tools/check_admin_case_builder_contract.py \
            services/api/tools/export_admin_case_builder_openapi_overlay.py \
            docs/contracts/openapi-admin-case-builder.v0.19.overlay.json \
            .github/workflows/admin-case-builder-finalize.yml
          git diff --cached --check
          git commit -m "chore(case-builder): finalize generated contract artifacts"
          git push origin HEAD:feature/admin-case-builder-draft-workspace
