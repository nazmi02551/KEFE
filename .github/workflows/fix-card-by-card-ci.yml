name: Fix Card-by-Card CI

on:
  push:
    branches:
      - feature/card-by-card-decision-subjourney

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/card-by-card-decision-subjourney
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Patch CI findings
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('apps/mobile/lib/features/decision/presentation/decision_subjourney.dart')
          text = source.read_text()
          old = "id: 'question:${question.id}',"
          new = 'id: question.id,'
          if old not in text:
              raise SystemExit('question stage id pattern not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('apps/mobile/test/progressive_result_disclosure_test.dart')
          text = test.read_text()
          old = """      await tapVisible(tester, find.byKey(const ValueKey('option-A')));\n      await tapVisible(tester, find.byKey(const ValueKey('commit-button')));"""
          new = """      await tapVisible(tester, find.byKey(const ValueKey('option-A')));\n      await tapVisible(\n        tester,\n        find.byKey(const ValueKey('decision-subjourney-next')),\n      );\n      await tapVisible(tester, find.byKey(const ValueKey('commit-button')));"""
          if old not in text:
              raise SystemExit('progressive result interaction pattern not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Format patched sources
        working-directory: apps/mobile
        run: dart format lib/features/decision/presentation/decision_subjourney.dart test/progressive_result_disclosure_test.dart
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/lib/features/decision/presentation/decision_subjourney.dart apps/mobile/test/progressive_result_disclosure_test.dart
          git commit -m "fix: align progressive result test with Decision subjourney"
          git push origin HEAD:feature/card-by-card-decision-subjourney
