name: Repair Canonical Public Feed

on:
  pull_request:
    paths:
      - '.github/workflows/patch-canonical-public-feed.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text: str, old: str, new: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {old[:100]!r}')
              return text.replace(old, new, 1)

          catalog_path = Path(
              'services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py'
          )
          catalog = catalog_path.read_text(encoding='utf-8')
          catalog = replace_required(
              catalog,
              'from kefe_api.modules.knowledge.rss_atom_public_capture import (\n'
              '    StrictRssAtomCaptureDefinition,\n'
              ')',
              'from kefe_api.modules.knowledge.rss_atom_capture import (\n'
              '    StrictRssAtomCaptureDefinition,\n'
              ')',
          )
          catalog = replace_required(
              catalog,
              '            parser_profile=public.parser_profile,',
              '            profile=public.parser_profile,',
          )
          parser_start = catalog.index('                "parser_profile": {\n')
          parser_end = catalog.index(
              '                "connect_timeout_ms":', parser_start
          )
          catalog = (
              catalog[:parser_start]
              + '                "parser_profile": '
              + 'definition.parser_profile.immutable_configuration,\n'
              + catalog[parser_end:]
          )
          list_start = catalog.index('    def list_definitions(\n')
          list_end = catalog.index('    def audit(\n', list_start)
          list_method = (
              '    def list_definitions(\n'
              '        self,\n'
              '        principal: AdminPrincipal,\n'
              '    ) -> tuple[CanonicalPublicFeedDefinition, ...]:\n'
              '        self._security.authorize_any(\n'
              '            principal,\n'
              '            frozenset(\n'
              '                {\n'
              '                    AdminCapability.SOURCE_MANAGE,\n'
              '                    AdminCapability.SOURCE_APPROVE,\n'
              '                    AdminCapability.SOURCE_ACTIVATE,\n'
              '                }\n'
              '            ),\n'
              '        )\n'
              '        return self._repository.list_definitions()\n\n'
          )
          catalog = catalog[:list_start] + list_method + catalog[list_end:]
          catalog_path.write_text(catalog, encoding='utf-8')

          test_path = Path('services/api/tests/test_canonical_public_feed_catalog.py')
          tests = test_path.read_text(encoding='utf-8')
          replacements = (
              (
                  'from kefe_api.modules.knowledge.rss_atom_public_capture import (\n'
                  '    StrictRssAtomParseProfile,\n'
                  ')',
                  'from kefe_api.modules.knowledge.rss_atom_capture import (\n'
                  '    StrictRssAtomParseProfile,\n'
                  ')',
              ),
              (
                  'from kefe_api.modules.knowledge.provider_control import (\n'
                  '    InMemoryProviderControlRepository,\n'
                  '    ProviderLifecycle,\n'
                  ')',
                  'from kefe_api.modules.knowledge.provider_control import (\n'
                  '    ProviderCapabilityLifecycle,\n'
                  ')\n'
                  'from kefe_api.modules.knowledge.provider_control_memory import (\n'
                  '    InMemorySourceProviderAdmissionRepository,\n'
                  ')',
              ),
              (
                  'from kefe_api.modules.knowledge.source_scheduler import (\n'
                  '    InMemorySourceAcquisitionScheduleRepository,\n'
                  '    SourceAcquisitionScheduleState,\n'
                  ')',
                  'from kefe_api.modules.knowledge.source_scheduler import (\n'
                  '    SourceAcquisitionScheduleState,\n'
                  ')\n'
                  'from kefe_api.modules.knowledge.source_scheduler_memory import (\n'
                  '    InMemorySourceAcquisitionSchedulerRepository,\n'
                  ')',
              ),
              (
                  'from kefe_api.modules.knowledge.source_scheduler_service import (\n'
                  '    SourceAcquisitionSchedulerService,\n'
                  ')',
                  'from kefe_api.modules.knowledge.source_scheduler_service import (\n'
                  '    NoOpSourceDispatchObserver,\n'
                  '    SourceAcquisitionSchedulerService,\n'
                  ')',
              ),
              (
                  'InMemoryProviderControlRepository()',
                  'InMemorySourceProviderAdmissionRepository()',
              ),
              (
                  'InMemorySourceAcquisitionScheduleRepository()',
                  'InMemorySourceAcquisitionSchedulerRepository()',
              ),
              ('providers.get_capability(', 'providers.get('),
              (
                  '.lifecycle is ProviderLifecycle.',
                  '.lifecycle_state is ProviderCapabilityLifecycle.',
              ),
              (
                  'assert schedules.list_schedules() == ()',
                  'assert schedules.plan_due_once(at=NOW + timedelta(days=1)) is None',
              ),
              (
                  'assert len(schedules.list_schedules()) == 1',
                  'assert schedules.get_schedule(first.schedule_id) == schedule',
              ),
              (
                  'assert preflight.allowed_origin == "https://feeds.example.test:443"',
                  'assert preflight.allowed_origin == "https://feeds.example.test"',
              ),
          )
          for old, new in replacements:
              tests = replace_required(tests, old, new)
          scheduler_start = tests.index(
              '        scheduler=SourceAcquisitionSchedulerService(\n'
          )
          scheduler_end = tests.index('        ),\n', scheduler_start) + len(
              '        ),\n'
          )
          scheduler_block = (
              '        scheduler=SourceAcquisitionSchedulerService(\n'
              '            repository=schedule_repository,\n'
              '            acquisition=object(),\n'
              '            observer=NoOpSourceDispatchObserver(),\n'
              '            clock=lambda: NOW,\n'
              '        ),\n'
          )
          tests = tests[:scheduler_start] + scheduler_block + tests[scheduler_end:]
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Normalize and verify changed Python
        run: |
          python -m pip install -q ruff==0.11.10
          ruff format \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/tests/test_canonical_public_feed_catalog.py \
            services/api/tools/check_canonical_public_feed_catalog.py
          ruff check --fix --exit-zero \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/tests/test_canonical_public_feed_catalog.py \
            services/api/tools/check_canonical_public_feed_catalog.py
          ruff format \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/tests/test_canonical_public_feed_catalog.py \
            services/api/tools/check_canonical_public_feed_catalog.py
          ruff check \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/tests/test_canonical_public_feed_catalog.py \
            services/api/tools/check_canonical_public_feed_catalog.py
          python -m py_compile \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/tests/test_canonical_public_feed_catalog.py \
            services/api/tools/check_canonical_public_feed_catalog.py
      - name: Remove temporary workflows and commit
        run: |
          git rm -f \
            .github/workflows/format-canonical-public-feed.yml \
            .github/workflows/patch-canonical-public-feed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py \
            services/api/tests/test_canonical_public_feed_catalog.py \
            services/api/tools/check_canonical_public_feed_catalog.py
          git commit -m 'fix: align canonical public-feed domain with active runtime APIs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
