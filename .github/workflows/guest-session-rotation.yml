name: Guest Session Rotation CI

on:
  pull_request:
    paths:
      - "services/api/src/kefe_api/modules/identity/in_memory.py"
      - "services/api/src/kefe_api/modules/identity/account_in_memory.py"
      - "services/api/src/kefe_api/infrastructure/postgres_identity.py"
      - "services/api/src/kefe_api/infrastructure/postgres_account_continuity.py"
      - "services/api/tests/test_guest_session_rotation.py"
      - "services/api/tests/test_mvp_completion.py"
      - "services/api/tests/test_mvp_completion_postgres.py"
      - "docs/adr/0109-rotate-guest-sessions-on-account-conversion.md"
      - ".github/workflows/guest-session-rotation.yml"
  push:
    branches: [main]
    paths:
      - "services/api/src/kefe_api/modules/identity/in_memory.py"
      - "services/api/src/kefe_api/modules/identity/account_in_memory.py"
      - "services/api/src/kefe_api/infrastructure/postgres_identity.py"
      - "services/api/src/kefe_api/infrastructure/postgres_account_continuity.py"
      - "services/api/tests/test_guest_session_rotation.py"
      - "services/api/tests/test_mvp_completion.py"
      - "services/api/tests/test_mvp_completion_postgres.py"
      - "docs/adr/0109-rotate-guest-sessions-on-account-conversion.md"
      - ".github/workflows/guest-session-rotation.yml"

permissions:
  contents: read

concurrency:
  group: guest-session-rotation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint identity rotation slice
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/identity/in_memory.py
          src/kefe_api/modules/identity/account_in_memory.py
          src/kefe_api/infrastructure/postgres_identity.py
          src/kefe_api/infrastructure/postgres_account_continuity.py
          tests/test_guest_session_rotation.py
          tests/test_mvp_completion.py
          tests/test_mvp_completion_postgres.py
      - name: Exact OpenAPI remains unchanged
        working-directory: services/api
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Memory session rotation and MVP proof
        working-directory: services/api
        run: >-
          pytest -q
          tests/test_guest_session_rotation.py
          tests/test_mvp_completion.py

  postgres:
    needs: memory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Seed canonical fixtures
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: |
          python -m kefe_api.infrastructure.seed_demo
          python -m kefe_api.infrastructure.seed_context_demo
          python -m kefe_api.infrastructure.seed_beta_catalog
      - name: PostgreSQL merge and session rotation proof
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_PERSISTENCE_BACKEND: postgres
          KEFE_RUN_POSTGRES_TESTS: "1"
        run: pytest -q tests/test_mvp_completion_postgres.py
