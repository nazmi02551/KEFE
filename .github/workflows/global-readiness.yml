name: Global Readiness

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'services/api/**'
      - 'docs/adr/0038-internal-alpha-localization-and-phone-acceptance.md'
      - 'docs/adr/0090-installable-phone-preview-and-unconfigured-production-shell-boundary.md'
      - 'docs/contracts/internal-alpha-hardening.v1.json'
      - 'docs/contracts/installable-phone-preview-hotfix.v1.json'
      - 'docs/contracts/openapi-global.v0.20.overlay.json'
      - 'docs/contracts/global-readiness.v1.yaml'
      - '.github/workflows/global-readiness.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-global:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff
        run: ruff check src tests tools migrations
      - name: Global discovery unit tests
        run: pytest -q tests/test_global_discovery.py
      - name: Generate OpenAPI 0.20 additive overlay
        run: python tools/export_global_openapi_overlay.py --output /tmp/openapi-global.v0.20.overlay.json
      - name: Upload generated 0.20 overlay
        uses: actions/upload-artifact@v4
        with:
          name: global-openapi-overlay-generated
          path: /tmp/openapi-global.v0.20.overlay.json
          if-no-files-found: error
      - name: Exact 0.20 overlay gate
        run: python tools/export_global_openapi_overlay.py --output ../../docs/contracts/openapi-global.v0.20.overlay.json --check

  postgres-global:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
      KEFE_PERSISTENCE_BACKEND: postgres
      KEFE_RUN_POSTGRES_TESTS: '1'
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL to global head
        run: alembic upgrade head
      - name: Seed canonical demo and beta catalog
        run: |
          python -m kefe_api.infrastructure.seed_demo
          python -m kefe_api.infrastructure.seed_context_demo
          python -m kefe_api.infrastructure.seed_beta_catalog
      - name: Existing PostgreSQL MVP regression
        run: >-
          pytest -q
          tests/test_community_reason_pattern_distribution_postgres.py
          tests/test_mvp_completion_postgres.py
          tests/test_progress_postgres.py
          tests/test_consensus_postgres.py

  phone-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Production copy boundary gate
        run: python tool/check_production_copy_boundary.py
      - name: Phone artifact boundary gate
        run: python tool/check_installable_phone_artifact_boundary.py
      - name: Normalize Dart formatting
        run: dart format lib test
      - name: Upload normalized mobile source
        uses: actions/upload-artifact@v4
        with:
          name: internal-alpha-mobile-normalized-source
          path: |
            apps/mobile/lib
            apps/mobile/test
          if-no-files-found: error
      - name: Whitespace safety gate
        run: git diff --check -- lib test
      - name: Analyze
        run: flutter analyze
      - name: Test mobile regressions
        run: flutter test --reporter expanded
      - name: Phone acceptance gate
        run: flutter test test/internal_alpha_phone_acceptance_test.dart --reporter expanded
      - name: Generate transient Android host
        run: flutter create --platforms=android --project-name kefe_mobile .
      - name: Build installable phone preview
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          flutter build apk --debug -t lib/main_preview.dart \
            --dart-define=KEFE_PREVIEW_VERSION=internal-alpha-rc1 \
            --dart-define=KEFE_PREVIEW_COMMIT=${CANDIDATE_SHA}
          mkdir -p build/phone-preview
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "build/phone-preview/KEFE-phone-preview-${CANDIDATE_SHA}.apk"
      - name: Upload installable phone preview
        uses: actions/upload-artifact@v4
        with:
          name: kefe-installable-phone-preview
          path: apps/mobile/build/phone-preview/KEFE-phone-preview-*.apk
          if-no-files-found: error
