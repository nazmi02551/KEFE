name: Global Readiness Fixup

on:
  pull_request:
    paths:
      - '.github/workflows/global-readiness.yml'
      - 'docs/migrations/internal-alpha-fix.patch'

permissions:
  contents: write

jobs:
  apply-fixup:
    if: github.head_ref == 'feature/internal-alpha-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/internal-alpha-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Apply semantic fixes
        run: |
          test -f docs/migrations/internal-alpha-fix.patch
          git apply --check docs/migrations/internal-alpha-fix.patch
          git apply docs/migrations/internal-alpha-fix.patch
      - name: Normalize Dart sources
        working-directory: apps/mobile
        run: dart format lib test
      - name: Commit source-only fixup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile
          git commit -m 'fix: normalize Internal Alpha localization runtime'
          git push origin HEAD:feature/internal-alpha-hardening
