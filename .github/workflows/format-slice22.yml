name: Format Slice 22

on:
  push:
    branches:
      - feature/premium-explore-discovery-slice22
    paths:
      - .github/workflows/format-slice22.yml
      - apps/mobile/lib/features/explore/presentation/discovery_explore_screen.dart
      - apps/mobile/test/premium_explore_discovery_slice22_test.dart

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply canonical Dart formatting
        run: |
          dart format \
            apps/mobile/lib/features/explore/presentation/discovery_explore_screen.dart \
            apps/mobile/test/premium_explore_discovery_slice22_test.dart
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo "No formatting drift remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile/lib/features/explore/presentation/discovery_explore_screen.dart \
            apps/mobile/test/premium_explore_discovery_slice22_test.dart
          git commit -m "chore: apply canonical Slice 22 Dart formatting"
          git push origin HEAD:feature/premium-explore-discovery-slice22
