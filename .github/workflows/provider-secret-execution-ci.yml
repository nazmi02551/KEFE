name: Provider Secret Execution CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_control*.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_execution_context.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_secret_execution.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_provider_execution_context.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_provider_secret_execution*.py'
      - 'services/api/tools/check_provider_secret_execution_contract.py'
      - 'docs/adr/0080-ephemeral-secret-resolution-and-secure-provider-invocation.md'
      - 'docs/contracts/provider-secret-execution-slice44.v1.json'
      - '.github/workflows/provider-secret-execution-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/provider_control*.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_execution_context.py'
      - 'services/api/src/kefe_api/modules/knowledge/provider_secret_execution.py'
      - 'services/api/src/kefe_api/modules/knowledge/source_acquisition.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_provider_execution_context.py'
      - 'services/api/src/kefe_api/infrastructure/editorial_pipeline.py'
      - 'services/api/tests/test_provider_secret_execution*.py'
      - 'services/api/tools/check_provider_secret_execution_contract.py'
      - 'docs/adr/0080-ephemeral-secret-resolution-and-secure-provider-invocation.md'
      - 'docs/contracts/provider-secret-execution-slice44.v1.json'
      - '.github/workflows/provider-secret-execution-ci.yml'

permissions:
  contents: read

jobs:
  provider-secret-execution:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff secret boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/provider_execution_context.py
          src/kefe_api/modules/knowledge/provider_secret_execution.py
          src/kefe_api/modules/knowledge/provider_control_ports.py
          src/kefe_api/modules/knowledge/provider_control_memory.py
          src/kefe_api/modules/knowledge/source_acquisition.py
          src/kefe_api/infrastructure/postgres_provider_execution_context.py
          src/kefe_api/infrastructure/editorial_pipeline.py
          tests/test_provider_secret_execution.py
          tests/test_provider_secret_execution_postgres.py
          tests/test_provider_secret_execution_architecture.py
          tools/check_provider_secret_execution_contract.py
      - name: Secret execution architecture fitness
        working-directory: services/api
        run: python tools/check_provider_secret_execution_contract.py
      - name: Secret lease and secure acquisition behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_provider_secret_execution.py
          tests/test_provider_secret_execution_architecture.py
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: PostgreSQL permit execution context
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: pytest tests/test_provider_secret_execution_postgres.py
