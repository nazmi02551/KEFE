name: Repair Public Feed Command Context

on:
  pull_request:
    paths:
      - '.github/workflows/repair-public-feed-command-context.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project direct acquisition command fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py'
          )
          source = path.read_text(encoding='utf-8')
          replacements = {
              '            locale=command.context.locale,\n': '            locale=command.locale,\n',
              '            jurisdiction_code=command.context.jurisdiction_code,\n': (
                  '            jurisdiction_code=command.jurisdiction_code,\n'
              ),
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected command context shape: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Normalize and verify
        working-directory: services/api
        run: |
          python -m pip install -q ruff==0.11.10
          ruff format src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py
          ruff check src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py
          python -m py_compile src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py
      - name: Remove repair workflow and commit
        run: |
          git rm -f .github/workflows/repair-public-feed-command-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py
          git commit -m 'fix: project direct source acquisition command fields'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
