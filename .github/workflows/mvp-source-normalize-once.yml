name: MVP Source Normalize Once

on:
  push:
    branches:
      - feature/mvp-completion-beta-gate

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-completion-beta-gate
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API tooling
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Normalize targeted API sources
        working-directory: services/api
        run: >-
          ruff format
          tests/test_consensus_postgres.py
          tests/test_mvp_completion_postgres.py
          tools/check_contract_sync.py
          tools/check_mvp_beta_readiness.py
      - name: Generate checked-in OpenAPI 0.19 additive overlay
        working-directory: services/api
        run: >-
          python tools/export_mvp_openapi_overlay.py
          --output ../../docs/contracts/openapi-mvp.v0.19.overlay.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Normalize Dart sources
        working-directory: apps/mobile
        run: dart format lib test
      - name: Apply analyzer-safe null-aware collection element
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('apps/mobile/lib/features/decision/presentation/perspective_section.dart')
          source = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^(\s*)if \(consensus != null\) consensus,$',
              r'\1?consensus,',
              source,
              count=1,
          )
          if count == 0 and '?consensus,' not in source:
              raise SystemExit('Expected consensus collection element was not found')
          if count:
              path.write_text(updated, encoding='utf-8')
          PY
          dart format apps/mobile/lib/features/decision/presentation/perspective_section.dart
      - name: Commit normalized MVP source
        run: |
          if git diff --quiet -- \
            services/api/tests/test_consensus_postgres.py \
            services/api/tests/test_mvp_completion_postgres.py \
            services/api/tools/check_contract_sync.py \
            services/api/tools/check_mvp_beta_readiness.py \
            docs/contracts/openapi-mvp.v0.19.overlay.json \
            apps/mobile/lib \
            apps/mobile/test; then
            echo 'Source already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/api/tests/test_consensus_postgres.py \
            services/api/tests/test_mvp_completion_postgres.py \
            services/api/tools/check_contract_sync.py \
            services/api/tools/check_mvp_beta_readiness.py \
            docs/contracts/openapi-mvp.v0.19.overlay.json \
            apps/mobile/lib \
            apps/mobile/test
          git commit -m 'chore: normalize MVP candidate sources and OpenAPI overlay'
          git push origin HEAD:feature/mvp-completion-beta-gate
