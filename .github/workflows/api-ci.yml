name: API CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'docs/contracts/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'docs/contracts/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Lint
        working-directory: services/api
        run: ruff check .
      - name: Test
        working-directory: services/api
        run: pytest --cov=kefe_api --cov-report=term-missing
