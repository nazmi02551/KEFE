name: API CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'docs/contracts/**'
      - 'infra/local/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'docs/contracts/**'
      - 'infra/local/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint
        working-directory: services/api
        run: ruff check .
      - name: Contract sync
        working-directory: services/api
        run: python tools/check_contract_sync.py
      - name: Unit tests
        working-directory: services/api
        run: pytest --ignore=tests/test_postgres_integration.py --cov=kefe_api --cov-report=term-missing

  postgres-integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Seed PostgreSQL demo
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: python -m kefe_api.infrastructure.seed_demo
      - name: PostgreSQL integration test
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: pytest tests/test_postgres_integration.py
