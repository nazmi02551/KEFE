name: API CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'docs/contracts/**'
      - 'infra/local/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'docs/contracts/**'
      - 'infra/local/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: services/api
        run: ruff check . --output-format=json > ruff-results.json
      - name: Upload lint diagnostics on failure
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-results
          path: services/api/ruff-results.json
          if-no-files-found: error
      - name: Enforce lint
        if: always()
        run: test '${{ steps.lint.outcome }}' = 'success'
      - name: Export generated OpenAPI
        working-directory: services/api
        run: python tools/export_openapi.py --output openapi.generated.json
      - name: Upload generated OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: services/api/openapi.generated.json
          if-no-files-found: error
      - name: Export Admin Proposal queue OpenAPI overlay
        working-directory: services/api
        run: >-
          python tools/export_admin_proposal_queue_openapi_overlay.py
          --output openapi-admin-proposal-queue.generated.json
      - name: Upload Admin Proposal queue OpenAPI overlay
        uses: actions/upload-artifact@v4
        with:
          name: openapi-admin-proposal-queue-generated
          path: services/api/openapi-admin-proposal-queue.generated.json
          if-no-files-found: error
      - name: Contract sync
        id: contract-sync
        continue-on-error: true
        working-directory: services/api
        run: python tools/check_contract_sync.py > contract-sync-output.txt 2>&1
      - name: Upload contract diagnostics on failure
        if: steps.contract-sync.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: contract-sync-output
          path: services/api/contract-sync-output.txt
          if-no-files-found: error
      - name: Enforce contract sync
        if: always()
        run: test '${{ steps.contract-sync.outcome }}' = 'success'
      - name: Case Flow pinning contract
        working-directory: services/api
        run: python tools/check_case_flow_pinning_contract.py
      - name: Generic Flow runtime contract
        working-directory: services/api
        run: python tools/check_generic_flow_runtime_contract.py
      - name: Decision revision lineage contract
        working-directory: services/api
        run: python tools/check_decision_revision_lineage_contract.py
      - name: Reflection runtime contract
        working-directory: services/api
        run: python tools/check_reflection_runtime_contract.py
      - name: Claim Argument ingestion contract
        working-directory: services/api
        run: python tools/check_claim_argument_ingestion_contract.py
      - name: Ingestion orchestration contract
        working-directory: services/api
        run: python tools/check_ingestion_orchestration_contract.py
      - name: Atomic ingestion stage batch contract
        working-directory: services/api
        run: python tools/check_atomic_ingestion_stage_batch_contract.py
      - name: Ingestion worker lease contract
        working-directory: services/api
        run: python tools/check_ingestion_worker_lease_contract.py
      - name: Ingestion worker runner contract
        working-directory: services/api
        run: python tools/check_ingestion_worker_runner_contract.py
      - name: Source acquisition admission contract
        working-directory: services/api
        run: python tools/check_source_acquisition_contract.py
      - name: Source acquisition scheduler contract
        working-directory: services/api
        run: python tools/check_source_acquisition_scheduler_contract.py
      - name: Editorial Projection contract
        working-directory: services/api
        run: python tools/check_editorial_projection_contract.py
      - name: Admin editorial operations HTTP contract
        working-directory: services/api
        run: python tools/check_admin_projection_http_contract.py
      - name: Admin Proposal review queue contract
        working-directory: services/api
        run: python tools/check_admin_proposal_queue_contract.py
      - name: Admin HTTP contract
        id: admin-http-contract
        continue-on-error: true
        working-directory: services/api
        run: python tools/check_admin_http_contract.py > admin-http-contract-output.txt 2>&1
      - name: Upload Admin HTTP diagnostics on failure
        if: steps.admin-http-contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-http-contract-output
          path: services/api/admin-http-contract-output.txt
          if-no-files-found: error
      - name: Enforce Admin HTTP contract
        if: always()
        run: test '${{ steps.admin-http-contract.outcome }}' = 'success'
      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        working-directory: services/api
        run: pytest --cov=kefe_api --cov-report=term-missing > unit-test-output.txt 2>&1
      - name: Upload unit test diagnostics on failure
        if: steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-unit-test-output
          path: services/api/unit-test-output.txt
          if-no-files-found: error
      - name: Enforce unit tests
        if: always()
        run: test '${{ steps.unit-tests.outcome }}' = 'success'
      - name: Admin Proposal queue OpenAPI overlay exact gate
        working-directory: services/api
        run: >-
          python tools/export_admin_proposal_queue_openapi_overlay.py
          --output ../../docs/contracts/openapi-admin-proposal-queue.v0.19.overlay.json
          --check
      - name: OpenAPI drift gate
        working-directory: services/api
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json

  postgres-integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Verify ingestion migrations downgrade and upgrade
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: |
          alembic downgrade 20260802_0020
          alembic upgrade head
      - name: Seed PostgreSQL demo
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: |
          python -m kefe_api.infrastructure.seed_demo
          python -m kefe_api.infrastructure.seed_context_demo
      - name: PostgreSQL integration tests
        id: postgres-tests
        continue-on-error: true
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: >-
          pytest
          tests/test_postgres_integration.py
          tests/test_postgres_outbox_integration.py
          tests/test_private_reason_postgres.py
          tests/test_perspective_postgres.py
          tests/test_context_postgres.py
          tests/test_progress_postgres.py
          tests/test_content_authoring_postgres.py
          tests/test_editorial_projection_postgres.py
          tests/test_ingestion_orchestration_postgres.py
          tests/test_ingestion_projection_bridge_postgres.py
          tests/test_ingestion_run_leases_postgres.py
          tests/test_ingestion_worker_runner_postgres.py
          tests/test_source_acquisition_postgres.py
          tests/test_source_acquisition_scheduler_postgres.py
          tests/test_admin_sessions_postgres.py
          tests/test_admin_http_postgres.py
          tests/test_admin_editorial_operations_http_postgres.py
          tests/test_admin_proposal_queue_http_postgres.py
          tests/test_content_configuration_postgres.py
          tests/test_admin_content_configuration_http_postgres.py
          tests/test_case_flow_pinning_postgres.py
          tests/test_flow_runtime_postgres.py
          tests/test_decision_revision_lineage_postgres.py
          tests/test_knowledge_graph_postgres.py
          tests/test_consensus_postgres.py
          > postgres-test-output.txt 2>&1
      - name: Upload PostgreSQL diagnostics on failure
        if: steps.postgres-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-output
          path: services/api/postgres-test-output.txt
          if-no-files-found: error
      - name: Enforce PostgreSQL tests
        if: always()
        run: test '${{ steps.postgres-tests.outcome }}' = 'success'
