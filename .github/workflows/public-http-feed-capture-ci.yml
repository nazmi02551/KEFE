name: Public HTTP Feed Capture CI

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/public_http_feed_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_parser.py'
      - 'services/api/tests/test_public_http_feed_capture*.py'
      - 'services/api/tests/test_rss_atom_parser*.py'
      - 'services/api/tools/check_public_http_feed_capture_contract.py'
      - 'services/api/tools/check_rss_atom_parser_contract.py'
      - 'docs/adr/0089-evidence-backed-public-http-feed-capture.md'
      - 'docs/contracts/public-http-feed-capture-slice53.v1.json'
      - '.github/workflows/public-http-feed-capture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/modules/knowledge/public_http_feed_capture.py'
      - 'services/api/src/kefe_api/modules/knowledge/rss_atom_parser.py'
      - 'services/api/tests/test_public_http_feed_capture*.py'
      - 'services/api/tests/test_rss_atom_parser*.py'
      - 'services/api/tools/check_public_http_feed_capture_contract.py'
      - 'services/api/tools/check_rss_atom_parser_contract.py'
      - 'docs/adr/0089-evidence-backed-public-http-feed-capture.md'
      - 'docs/contracts/public-http-feed-capture-slice53.v1.json'
      - '.github/workflows/public-http-feed-capture-ci.yml'

permissions:
  contents: read

jobs:
  public-http-feed-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff public HTTP feed boundary
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/modules/knowledge/public_http_feed_capture.py
          src/kefe_api/modules/knowledge/rss_atom_parser.py
          tests/test_public_http_feed_capture.py
          tests/test_public_http_feed_capture_architecture.py
          tests/test_rss_atom_parser.py
          tests/test_rss_atom_parser_architecture.py
          tools/check_public_http_feed_capture_contract.py
          tools/check_rss_atom_parser_contract.py
      - name: Public HTTP feed architecture fitness
        working-directory: services/api
        run: python tools/check_public_http_feed_capture_contract.py
      - name: Parent RSS Atom parser architecture fitness
        working-directory: services/api
        run: python tools/check_rss_atom_parser_contract.py
      - name: Public HTTP feed behavior
        working-directory: services/api
        run: >-
          pytest
          tests/test_public_http_feed_capture.py
          tests/test_public_http_feed_capture_architecture.py
          tests/test_rss_atom_parser.py
          tests/test_rss_atom_parser_architecture.py
