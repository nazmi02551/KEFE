name: Guest Merge Replay CI

on:
  pull_request:
    paths:
      - "services/api/src/kefe_api/core/settings.py"
      - "services/api/src/kefe_api/modules/identity/**"
      - "services/api/src/kefe_api/infrastructure/postgres_identity.py"
      - "services/api/src/kefe_api/infrastructure/postgres_account_continuity.py"
      - "services/api/migrations/versions/20260805_0030_guest_merge_replay.py"
      - "services/api/tests/test_guest_merge_replay.py"
      - "services/api/tests/test_guest_merge_replay_postgres.py"
      - "services/api/tests/test_mvp_completion.py"
      - "services/api/tests/test_mvp_completion_postgres.py"
      - "services/api/tools/check_guest_account_merge_replay_contract.py"
      - "docs/adr/0110-durable-guest-account-conversion-replay.md"
      - "docs/contracts/guest-account-merge-replay.v1.json"
      - ".github/workflows/guest-merge-replay.yml"
  push:
    branches: [main]
    paths:
      - "services/api/src/kefe_api/core/settings.py"
      - "services/api/src/kefe_api/modules/identity/**"
      - "services/api/src/kefe_api/infrastructure/postgres_identity.py"
      - "services/api/src/kefe_api/infrastructure/postgres_account_continuity.py"
      - "services/api/migrations/versions/20260805_0030_guest_merge_replay.py"
      - "services/api/tests/test_guest_merge_replay.py"
      - "services/api/tests/test_guest_merge_replay_postgres.py"
      - "services/api/tests/test_mvp_completion.py"
      - "services/api/tests/test_mvp_completion_postgres.py"
      - "services/api/tools/check_guest_account_merge_replay_contract.py"
      - "docs/adr/0110-durable-guest-account-conversion-replay.md"
      - "docs/contracts/guest-account-merge-replay.v1.json"
      - ".github/workflows/guest-merge-replay.yml"

permissions:
  contents: read

concurrency:
  group: guest-merge-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Lint replay slice
        working-directory: services/api
        run: >-
          ruff check
          src/kefe_api/core/settings.py
          src/kefe_api/modules/identity
          src/kefe_api/infrastructure/postgres_identity.py
          src/kefe_api/infrastructure/postgres_account_continuity.py
          migrations/versions/20260805_0030_guest_merge_replay.py
          tests/test_guest_merge_replay.py
          tests/test_guest_merge_replay_postgres.py
          tools/check_guest_account_merge_replay_contract.py
      - name: Executable guest merge replay contract
        working-directory: services/api
        run: python tools/check_guest_account_merge_replay_contract.py
      - name: Exact OpenAPI remains unchanged
        working-directory: services/api
        run: python tools/export_openapi.py --check ../../docs/contracts/openapi.v1.json
      - name: Memory exact replay and regression proof
        working-directory: services/api
        run: >-
          pytest -q
          tests/test_guest_merge_replay.py
          tests/test_guest_session_rotation.py
          tests/test_mvp_completion.py

  postgres:
    needs: memory
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Seed canonical fixtures
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: |
          python -m kefe_api.infrastructure.seed_demo
          python -m kefe_api.infrastructure.seed_context_demo
          python -m kefe_api.infrastructure.seed_beta_catalog
      - name: PostgreSQL restart concurrency and privacy proof
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_PERSISTENCE_BACKEND: postgres
          KEFE_RUN_POSTGRES_TESTS: "1"
          KEFE_ACCOUNT_MERGE_REPLAY_SECRET: ci-stable-guest-merge-replay-secret-0123456789
        run: >-
          pytest -q
          tests/test_guest_merge_replay_postgres.py
          tests/test_mvp_completion_postgres.py
