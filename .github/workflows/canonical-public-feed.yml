name: Canonical Public Feed

# The canonical gate proves one catalog/activation model in memory and PostgreSQL.
# Feed codes are stable business identities; adapter codes remain immutable .vN
# identities. Catalog hash, ingestion hash and schedule policy remain distinct.
on:
  pull_request:
    paths:
      - 'services/api/migrations/versions/20260804_0026_canonical_public_feed_catalog.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_canonical_public_feed_catalog.py'
      - 'services/api/src/kefe_api/modules/admin_security/models.py'
      - 'services/api/src/kefe_api/modules/admin_security/policy.py'
      - 'services/api/src/kefe_api/modules/admin_security/service.py'
      - 'services/api/src/kefe_api/modules/knowledge/public_feed_runtime.py'
      - 'services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py'
      - 'services/api/tests/test_canonical_public_feed_catalog.py'
      - 'services/api/tests/test_canonical_public_feed_catalog_postgres.py'
      - 'services/api/tools/check_canonical_public_feed_catalog.py'
      - 'docs/adr/0098-canonical-public-feed-catalog-activation.md'
      - 'docs/contracts/canonical-public-feed-catalog-activation.v1.json'
      - 'docs/contracts/error-codes.canonical-public-feed.v1.yaml'
      - '.github/workflows/canonical-public-feed.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/migrations/versions/20260804_0026_canonical_public_feed_catalog.py'
      - 'services/api/src/kefe_api/infrastructure/postgres_canonical_public_feed_catalog.py'
      - 'services/api/src/kefe_api/modules/admin_security/**'
      - 'services/api/src/kefe_api/modules/knowledge/public_feed_runtime.py'
      - 'services/api/src/kefe_api/modules/knowledge/canonical_public_feed_catalog.py'
      - 'services/api/tests/test_canonical_public_feed_catalog*'
      - 'services/api/tools/check_canonical_public_feed_catalog.py'
      - 'docs/adr/0098-canonical-public-feed-catalog-activation.md'
      - 'docs/contracts/canonical-public-feed-catalog-activation.v1.json'
      - '.github/workflows/canonical-public-feed.yml'

permissions:
  contents: read

jobs:
  memory-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff
        working-directory: services/api
        run: ruff check .
      - name: Architecture contract
        working-directory: services/api
        run: python tools/check_canonical_public_feed_catalog.py
      - name: Canonical public-feed lifecycle
        working-directory: services/api
        run: pytest -q tests/test_canonical_public_feed_catalog.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kefe
          POSTGRES_USER: kefe
          POSTGRES_PASSWORD: kefe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kefe -d kefe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Migrate PostgreSQL
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
        run: alembic upgrade head
      - name: Canonical public-feed PostgreSQL behavior
        working-directory: services/api
        env:
          KEFE_DATABASE_URL: postgresql+psycopg://kefe:kefe@localhost:5432/kefe
          KEFE_RUN_POSTGRES_TESTS: '1'
        run: pytest -q tests/test_canonical_public_feed_catalog_postgres.py
