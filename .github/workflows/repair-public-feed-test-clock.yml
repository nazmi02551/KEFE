name: Repair Public Feed Test Clock

on:
  pull_request:
    paths:
      - '.github/workflows/repair-public-feed-test-clock.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep security assurance relative to execution time
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/test_canonical_public_feed_catalog.py')
          source = path.read_text(encoding='utf-8')
          old = '''def _principal(
              role: AdminRole,
              *,
              direct: frozenset[AdminCapability] = frozenset(),
              subject_id=None,
          ) -> AdminPrincipal:
              return AdminPrincipal(
                  admin_subject_id=subject_id or uuid4(),
                  session_id=uuid4(),
                  roles=frozenset({role}),
                  direct_capabilities=direct,
                  authenticated_at=NOW - timedelta(minutes=5),
                  mfa_satisfied_at=NOW - timedelta(minutes=5),
                  step_up_at=NOW - timedelta(minutes=2),
                  expires_at=NOW + timedelta(hours=2),
                  last_seen_at=NOW - timedelta(minutes=1),
              )
          '''
          new = '''def _principal(
              role: AdminRole,
              *,
              direct: frozenset[AdminCapability] = frozenset(),
              subject_id=None,
          ) -> AdminPrincipal:
              current = datetime.now(UTC)
              return AdminPrincipal(
                  admin_subject_id=subject_id or uuid4(),
                  session_id=uuid4(),
                  roles=frozenset({role}),
                  direct_capabilities=direct,
                  authenticated_at=current - timedelta(minutes=5),
                  mfa_satisfied_at=current - timedelta(minutes=5),
                  step_up_at=current - timedelta(minutes=2),
                  expires_at=current + timedelta(hours=2),
                  last_seen_at=current - timedelta(minutes=1),
              )
          '''
          if source.count(old) != 1:
              raise SystemExit('unexpected principal fixture shape')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Normalize and verify
        working-directory: services/api
        run: |
          python -m pip install -q ruff==0.11.10
          ruff format tests/test_canonical_public_feed_catalog.py
          ruff check tests/test_canonical_public_feed_catalog.py
          python -m py_compile tests/test_canonical_public_feed_catalog.py
      - name: Remove repair workflow and commit
        run: |
          git rm -f .github/workflows/repair-public-feed-test-clock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/tests/test_canonical_public_feed_catalog.py
          git commit -m 'test: keep Admin assurance relative to execution time'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
