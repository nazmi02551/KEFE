name: Canonical Admin Review Convergence

on:
  pull_request:
    paths:
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/feed_item_review_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_ingestion_router.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_review.py'
      - 'services/api/src/kefe_api/modules/admin_security/source_brief_review_router.py'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py'
      - 'services/api/tests/test_admin_feed_item_review_http.py'
      - 'services/api/tests/test_source_brief_ingestion_http.py'
      - 'services/api/tests/test_admin_source_brief_review_http.py'
      - 'services/api/tools/check_canonical_admin_review_convergence.py'
      - 'docs/adr/0097-canonical-admin-feed-source-brief-review.md'
      - 'docs/contracts/canonical-admin-feed-source-brief-review.v1.json'
      - 'docs/contracts/error-codes.admin-feed-item-review.v1.yaml'
      - 'docs/contracts/error-codes.source-brief-ingestion.v1.yaml'
      - 'docs/contracts/error-codes.admin-source-brief-review.v1.yaml'
      - '.github/workflows/canonical-admin-review-convergence.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/kefe_api/main.py'
      - 'services/api/src/kefe_api/modules/admin_security/**'
      - 'services/api/src/kefe_api/modules/ingestion_orchestration/source_brief_ingestion.py'
      - 'services/api/tests/test_*source_brief*'
      - 'services/api/tests/test_admin_feed_item_review_http.py'
      - 'services/api/tools/check_canonical_admin_review_convergence.py'
      - 'docs/adr/0097-canonical-admin-feed-source-brief-review.md'
      - 'docs/contracts/canonical-admin-feed-source-brief-review.v1.json'
      - '.github/workflows/canonical-admin-review-convergence.yml'

permissions:
  contents: read

jobs:
  memory-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Ruff
        working-directory: services/api
        run: ruff check .
      - name: Architecture contract
        working-directory: services/api
        run: python tools/check_canonical_admin_review_convergence.py
      - name: Typed Admin review behavior
        working-directory: services/api
        run: >-
          pytest -q
          tests/test_admin_feed_item_review_http.py
          tests/test_source_brief_ingestion_http.py
          tests/test_admin_source_brief_review_http.py
