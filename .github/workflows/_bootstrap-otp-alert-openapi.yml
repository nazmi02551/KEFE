name: Bootstrap OTP Alert OpenAPI

on:
  pull_request:
    paths:
      - ".github/workflows/_bootstrap-otp-alert-openapi.yml"
      - "services/api/src/kefe_api/modules/admin_security/operational_reports_router.py"
      - "docs/contracts/openapi.v1.json"

permissions:
  contents: write

concurrency:
  group: bootstrap-otp-alert-openapi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        working-directory: services/api
        run: python -m pip install -q -U pip && pip install -q -e '.[dev]'
      - name: Generate canonical OpenAPI
        working-directory: services/api
        run: python tools/export_openapi.py --output ../../docs/contracts/openapi.v1.json
      - name: Commit exact generated contract
        run: |
          if git diff --quiet -- docs/contracts/openapi.v1.json; then
            echo "Canonical OpenAPI already matches runtime."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contracts/openapi.v1.json
          git commit -m "docs(api): sync OTP alert OpenAPI"
          git push origin HEAD:${{ github.head_ref }}
