name: Apply Progressive Result Context History

on:
  push:
    branches:
      - feature/progressive-result-context-history

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progressive-result-context-history
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Patch remaining progressive surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Decision experience: staged Result, progressive Context and repeated Decision title.
          path = Path('apps/mobile/lib/features/decision/presentation/decision_experience_screen.dart')
          text = path.read_text()
          for line in [
              "import '../../community_reason/presentation/community_reason_section.dart';\n",
              "import '../../consensus/presentation/consensus_section.dart';\n",
              "import '../../progress/presentation/progress_section.dart';\n",
              "import '../../sharing/presentation/share_section.dart';\n",
              "import 'perspective_section.dart';\n",
              "import 'reveal_result_card.dart';\n",
          ]:
              text = text.replace(line, '')
          if "import 'post_commit_journey.dart';" not in text:
              text = text.replace(
                  "import 'decision_subjourney.dart';\n",
                  "import 'decision_subjourney.dart';\nimport 'post_commit_journey.dart';\n",
              )
          text, count = re.subn(
              r"  bool _showPerspectives = false;\n\n  @override\n  void didUpdateWidget\(covariant _ProgressiveDecisionContent oldWidget\) \{.*?\n  \}\n\n",
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected progressive state cleanup once, got {count}')
          text = text.replace(
              "title: strings.activeJourneyTitle(activeStep.primitiveCode),",
              "title: strings.activeJourneyTitle(\n              activeStep.primitiveCode,\n              repeatedDecision: DecisionJourneyStageResolver.isRepeatedDecision(\n                runtime,\n                activeStep,\n              ),\n            ),",
          )
          text = text.replace(
              "              showPerspectives: _showPerspectives,\n              onShowPerspectives: () {\n                setState(() => _showPerspectives = true);\n              },\n",
              '',
          )
          text = text.replace(
              "    required this.showPerspectives,\n    required this.onShowPerspectives,\n",
              '',
          )
          text = text.replace(
              "  final bool showPerspectives;\n  final VoidCallback onShowPerspectives;\n",
              '',
          )
          text = text.replace(
              "      'COLLECTIVE_RESULT' => _resultStep(context, ref),",
              "      'COLLECTIVE_RESULT' => _resultStep(context),",
          )
          text = text.replace(
              "ContextSection(caseVersionId: state.caseData!.versionId)",
              "ContextSection(\n          caseVersionId: state.caseData!.versionId,\n          progressive: true,\n        )",
          )
          replacement = r'''  Widget _resultStep(BuildContext context) {
            if (step.state == FlowStepRuntimeState.unsupported) {
              return _JourneyMessageSurface(
                message: KefeStrings.of(
                  context,
                ).flowCapabilityPendingBody(step.reasonCode),
              );
            }
            if (step.state != FlowStepRuntimeState.ready || state.reveal == null) {
              return const SizedBox.shrink();
            }

            final sessionId = state.sessionId!;
            final caseVersionId = state.caseData!.versionId;
            return PostCommitJourney(
              state: state,
              sessionId: sessionId,
              caseVersionId: caseVersionId,
              completionAction: firstUse
                  ? _JourneyFirstUseCompletion(
                      onContinue: () => context.go('/explore'),
                    )
                  : null,
            );
          }
        }

        class _JourneyCaseHeader'''
          text, count = re.subn(
              r"  Widget _resultStep\(BuildContext context, WidgetRef ref\) \{.*?\n  \}\n\}\n\nclass _JourneyCaseHeader",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected result method replacement once, got {count}')
          text, count = re.subn(
              r"class _PerspectiveDisclosurePanel extends StatelessWidget \{.*?\n\}\n\nclass _JourneyCommitPanel",
              'class _JourneyCommitPanel',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected disclosure panel removal once, got {count}')
          path.write_text(text)

          # Context: keep legacy default and add an explicit optional layer journey.
          path = Path('apps/mobile/lib/features/context/presentation/context_section.dart')
          text = path.read_text()
          if "import 'context_journey_strings.dart';" not in text:
              text = text.replace(
                  "import '../domain/context_models.dart';\n",
                  "import '../domain/context_models.dart';\nimport 'context_journey_strings.dart';\n",
              )
          text = text.replace(
              "  const ContextSection({required this.caseVersionId, super.key});\n\n  final String caseVersionId;",
              "  const ContextSection({\n    required this.caseVersionId,\n    this.progressive = false,\n    super.key,\n  });\n\n  final String caseVersionId;\n  final bool progressive;",
          )
          text = text.replace(
              "          child: _ContextContent(snapshot: snapshot),",
              "          child: progressive\n              ? _ProgressiveContextContent(snapshot: snapshot)\n              : _ContextContent(snapshot: snapshot),",
          )
          marker = 'class _StatusSummary extends StatelessWidget {'
          if marker not in text:
              raise SystemExit('Context insertion marker missing')
          progressive_context = r'''
        class _ProgressiveContextContent extends ConsumerStatefulWidget {
          const _ProgressiveContextContent({required this.snapshot});

          final CaseContextSnapshot snapshot;

          @override
          ConsumerState<_ProgressiveContextContent> createState() =>
              _ProgressiveContextContentState();
        }

        class _ProgressiveContextContentState
            extends ConsumerState<_ProgressiveContextContent> {
          int _index = 0;

          @override
          void didUpdateWidget(covariant _ProgressiveContextContent oldWidget) {
            super.didUpdateWidget(oldWidget);
            if (oldWidget.snapshot.caseVersionId !=
                widget.snapshot.caseVersionId) {
              _index = 0;
            }
          }

          List<ContextJourneyLayer> get _layers => [
            ContextJourneyLayer.essential,
            if (widget.snapshot.detailBlocks.isNotEmpty)
              ContextJourneyLayer.details,
            if (widget.snapshot.sources.isNotEmpty) ContextJourneyLayer.sources,
          ];

          void _move(int delta) {
            final next = (_index + delta).clamp(0, _layers.length - 1).toInt();
            if (next == _index) return;
            setState(() => _index = next);
          }

          @override
          Widget build(BuildContext context) {
            final strings = KefeStrings.of(context);
            final visual = context.kefeVisual;
            final layer = _layers[_index];
            final accent = switch (layer) {
              ContextJourneyLayer.essential => visual.gold,
              ContextJourneyLayer.details => visual.rules,
              ContextJourneyLayer.sources => visual.success,
            };
            return Column(
              key: const ValueKey('context-progressive-journey'),
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Container(
                      width: 44,
                      height: 44,
                      decoration: BoxDecoration(
                        color: accent.withValues(alpha: 0.10),
                        borderRadius: BorderRadius.circular(14),
                        border: Border.all(color: accent.withValues(alpha: 0.22)),
                      ),
                      child: Icon(_icon(layer), color: accent),
                    ),
                    const SizedBox(width: 13),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          KefeEyebrow(
                            strings.contextJourneyProgress(
                              _index + 1,
                              _layers.length,
                            ),
                            color: accent,
                          ),
                          const SizedBox(height: 5),
                          Text(
                            strings.contextJourneyTitle(layer),
                            style: Theme.of(context).textTheme.titleLarge?.copyWith(
                              fontWeight: FontWeight.w900,
                              height: 1.18,
                            ),
                          ),
                          const SizedBox(height: 5),
                          Text(
                            strings.contextJourneyHelper(layer),
                            style: Theme.of(context).textTheme.bodySmall?.copyWith(
                              color: visual.mutedForeground,
                              height: 1.42,
                            ),
                          ),
                        ],
                      ),
                    ),
                    if (layer != ContextJourneyLayer.essential)
                      Container(
                        padding: const EdgeInsets.symmetric(
                          horizontal: 8,
                          vertical: 5,
                        ),
                        decoration: BoxDecoration(
                          color: visual.surfaceSunken,
                          borderRadius: BorderRadius.circular(99),
                          border: Border.all(color: visual.border),
                        ),
                        child: Text(
                          strings.contextJourneyOptional,
                          style: Theme.of(context).textTheme.labelSmall?.copyWith(
                            color: visual.mutedForeground,
                            fontWeight: FontWeight.w700,
                          ),
                        ),
                      ),
                  ],
                ),
                const SizedBox(height: 18),
                AnimatedSwitcher(
                  duration: KefeMotion.resolve(
                    context,
                    const Duration(milliseconds: 200),
                  ),
                  child: KeyedSubtree(
                    key: ValueKey('context-layer-${layer.name}'),
                    child: _layerContent(layer),
                  ),
                ),
                if (_layers.length > 1) ...[
                  const SizedBox(height: 14),
                  Row(
                    children: [
                      if (_index > 0)
                        Expanded(
                          child: OutlinedButton.icon(
                            key: const ValueKey('context-journey-back'),
                            onPressed: () => _move(-1),
                            icon: const Icon(Icons.arrow_back_rounded),
                            label: Text(strings.contextJourneyBack),
                          ),
                        ),
                      if (_index > 0 && _index < _layers.length - 1)
                        const SizedBox(width: 10),
                      if (_index < _layers.length - 1)
                        Expanded(
                          child: FilledButton.icon(
                            key: const ValueKey('context-journey-next'),
                            onPressed: () => _move(1),
                            icon: const Icon(Icons.arrow_forward_rounded),
                            label: Text(strings.contextJourneyNext),
                          ),
                        ),
                    ],
                  ),
                ],
              ],
            );
          }

          Widget _layerContent(ContextJourneyLayer layer) => switch (layer) {
            ContextJourneyLayer.essential => _essential(),
            ContextJourneyLayer.details => _details(),
            ContextJourneyLayer.sources => _sources(),
          };

          Widget _essential() {
            final strings = KefeStrings.of(context);
            final content = ref.watch(kefeContentLocalizerProvider);
            final counts = <String, int>{};
            for (final block in widget.snapshot.blocks) {
              counts.update(
                block.claimStatus,
                (value) => value + 1,
                ifAbsent: () => 1,
              );
            }
            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                if (counts.isNotEmpty) ...[
                  Wrap(
                    spacing: 8,
                    runSpacing: 8,
                    children: [
                      for (final entry in counts.entries)
                        _StatusSummary(
                          label: strings.contextClaimStatus(entry.key),
                          count: entry.value,
                          color: _statusColor(context, entry.key),
                        ),
                    ],
                  ),
                  const SizedBox(height: 16),
                ],
                for (final block in widget.snapshot.essentialBlocks) ...[
                  _ContextBlockTile(
                    block: block,
                    snapshot: widget.snapshot,
                    content: content,
                    locale: strings.locale,
                  ),
                  const SizedBox(height: 12),
                ],
              ],
            );
          }

          Widget _details() {
            final strings = KefeStrings.of(context);
            final content = ref.watch(kefeContentLocalizerProvider);
            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                for (final block in widget.snapshot.detailBlocks) ...[
                  _ContextBlockTile(
                    block: block,
                    snapshot: widget.snapshot,
                    content: content,
                    locale: strings.locale,
                  ),
                  const SizedBox(height: 12),
                ],
              ],
            );
          }

          Widget _sources() {
            final strings = KefeStrings.of(context);
            final visual = context.kefeVisual;
            final content = ref.watch(kefeContentLocalizerProvider);
            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                for (final source in widget.snapshot.sources)
                  ListTile(
                    key: ValueKey('context-source-${source.id}'),
                    contentPadding: const EdgeInsets.symmetric(horizontal: 4),
                    leading: Container(
                      width: 40,
                      height: 40,
                      decoration: BoxDecoration(
                        color: visual.subtleRulesSurface,
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: Icon(
                        Icons.verified_outlined,
                        color: visual.rules,
                        size: 20,
                      ),
                    ),
                    title: Text(
                      content.text(
                        namespace: KefeContentNamespace.contextSourceTitle,
                        id: source.id,
                        locale: strings.locale,
                        fallback: source.title,
                      ),
                    ),
                    subtitle: Text(
                      '${content.text(namespace: KefeContentNamespace.contextPublisher, id: source.publisher, locale: strings.locale, fallback: source.publisher)} · ${strings.contextSourceKind(source.sourceKind)}',
                      style: TextStyle(color: visual.mutedForeground),
                    ),
                  ),
              ],
            );
          }

          IconData _icon(ContextJourneyLayer layer) => switch (layer) {
            ContextJourneyLayer.essential => Icons.article_outlined,
            ContextJourneyLayer.details => Icons.subject_rounded,
            ContextJourneyLayer.sources => Icons.verified_outlined,
          };
        }

        '''
          text = text.replace(marker, progressive_context + marker, 1)
          path.write_text(text)

          # My KEFE: replace static journey cards with descriptive expandable timelines.
          path = Path('apps/mobile/lib/features/progress/presentation/my_kefe_journey_screen.dart')
          text = path.read_text()
          journeys = r'''class _Journeys extends StatelessWidget {
          const _Journeys({required this.items, required this.strings});

          final List<MyKefeRecentJourney> items;
          final KefeStrings strings;

          @override
          Widget build(BuildContext context) {
            return KefeSurface(
              key: const ValueKey('my-kefe-recent-journeys'),
              tone: KefeSurfaceTone.raised,
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  KefeEyebrow(strings.journeyRecent, icon: Icons.history_rounded),
                  const SizedBox(height: 14),
                  for (var i = 0; i < items.length; i++) ...[
                    _ExpandableJourneyCard(item: items[i], strings: strings),
                    if (i != items.length - 1) const SizedBox(height: 10),
                  ],
                ],
              ),
            );
          }
        }

        class _ExpandableJourneyCard extends ConsumerWidget {
          const _ExpandableJourneyCard({required this.item, required this.strings});

          final MyKefeRecentJourney item;
          final KefeStrings strings;

          @override
          Widget build(BuildContext context, WidgetRef ref) {
            final visual = context.kefeVisual;
            final locale = Localizations.localeOf(context);
            final localizer = ref.watch(kefeContentLocalizerProvider);
            final title = localizer.text(
              namespace: KefeContentNamespace.caseTitle,
              id: item.caseId,
              locale: locale,
              fallback: item.title,
            );
            return Theme(
              data: Theme.of(context).copyWith(dividerColor: Colors.transparent),
              child: Container(
                decoration: BoxDecoration(
                  color: visual.surfaceSunken,
                  borderRadius: BorderRadius.circular(17),
                  border: Border.all(color: visual.border),
                ),
                child: ExpansionTile(
                  key: ValueKey('my-kefe-journey-detail-${item.caseId}'),
                  tilePadding: const EdgeInsets.symmetric(
                    horizontal: 13,
                    vertical: 4,
                  ),
                  childrenPadding: const EdgeInsets.fromLTRB(13, 0, 13, 14),
                  iconColor: visual.gold,
                  collapsedIconColor: visual.mutedForeground,
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        strings.domainName(item.primaryDomain),
                        style: Theme.of(context).textTheme.labelSmall?.copyWith(
                          color: visual.gold,
                          fontWeight: FontWeight.w800,
                        ),
                      ),
                      const SizedBox(height: 5),
                      Text(
                        title,
                        style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                          fontWeight: FontWeight.w800,
                        ),
                      ),
                    ],
                  ),
                  subtitle: Padding(
                    padding: const EdgeInsets.only(top: 9),
                    child: Wrap(
                      spacing: 8,
                      runSpacing: 8,
                      children: [
                        if (item.decisionUpdateCount > 0)
                          _JourneyPill(
                            label: strings.journeyUpdateCount(
                              item.decisionUpdateCount,
                            ),
                            color: visual.rules,
                          ),
                        if (item.reflectionCompleted)
                          _JourneyPill(
                            label: strings.journeyReflected,
                            color: visual.gold,
                          ),
                        _JourneyPill(
                          label: strings.journeyDetails,
                          color: visual.mutedForeground,
                        ),
                      ],
                    ),
                  ),
                  children: [
                    _JourneyTimeline(item: item, strings: strings),
                  ],
                ),
              ),
            );
          }
        }

        class _JourneyTimeline extends StatelessWidget {
          const _JourneyTimeline({required this.item, required this.strings});

          final MyKefeRecentJourney item;
          final KefeStrings strings;

          @override
          Widget build(BuildContext context) {
            final visual = context.kefeVisual;
            final dates = MaterialLocalizations.of(context);
            String format(DateTime value) => dates.formatMediumDate(value.toLocal());
            return KefeSurface(
              key: const ValueKey('my-kefe-journey-timeline'),
              tone: KefeSurfaceTone.raised,
              accent: visual.rules,
              padding: const EdgeInsets.all(14),
              borderRadius: 15,
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.stretch,
                children: [
                  KefeEyebrow(
                    strings.journeyTimeline,
                    icon: Icons.route_rounded,
                    color: visual.rules,
                  ),
                  const SizedBox(height: 13),
                  _JourneyTimelineItem(
                    icon: Icons.lock_outline_rounded,
                    color: visual.gold,
                    title: strings.journeyInitialCommit,
                    value: format(item.initialCommittedAt),
                  ),
                  const SizedBox(height: 12),
                  _JourneyTimelineItem(
                    icon: Icons.change_circle_outlined,
                    color: visual.rules,
                    title: item.decisionUpdateCount > 0
                        ? strings.journeyUpdateCount(item.decisionUpdateCount)
                        : strings.journeyNoUpdate,
                    value: item.decisionUpdateCount > 0
                        ? '${strings.journeyLatestDecision} · ${format(item.latestDecisionAt)}'
                        : format(item.latestDecisionAt),
                  ),
                  const SizedBox(height: 12),
                  _JourneyTimelineItem(
                    icon: item.reflectionCompleted
                        ? Icons.check_circle_outline_rounded
                        : Icons.hourglass_empty_rounded,
                    color: item.reflectionCompleted
