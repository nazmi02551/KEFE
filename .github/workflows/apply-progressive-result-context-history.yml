            expect(find.text('Ek bağlam.'), findsOneWidget);
            expect(tester.takeException(), isNull);
          });
        '''
          pos = text.rfind('\n}')
          if pos < 0:
              raise SystemExit('context test main close missing')
          text = text[:pos] + insertion + text[pos:]
          path.write_text(text)

          # Existing history visual matrix now verifies journey expansion.
          path = Path('apps/mobile/test/premium_history_slice11_test.dart')
          text = path.read_text()
          needle = """          expect(find.byType(KefeSurface), findsWidgets);\n\n          final footnote = find.byKey("""
          replacement = """          expect(find.byType(KefeSurface), findsWidgets);\n\n          final recentJourneys = find.byKey(\n            const ValueKey('my-kefe-recent-journeys'),\n          );\n          await tester.ensureVisible(recentJourneys);\n          final firstJourney = find.descendant(\n            of: recentJourneys,\n            matching: find.byType(ExpansionTile),\n          ).first;\n          await tester.tap(firstJourney);\n          await tester.pumpAndSettle();\n          expect(\n            find.byKey(const ValueKey('my-kefe-journey-timeline')),\n            findsOneWidget,\n          );\n\n          final footnote = find.byKey("""
          if needle not in text:
