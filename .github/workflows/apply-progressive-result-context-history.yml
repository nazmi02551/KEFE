        class _LegacyRecent'''
          text, count = re.subn(
              r"class _Journeys extends ConsumerWidget \{.*?\n\}\n\nclass _LegacyRecent",
              journeys,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected My KEFE journeys replacement once, got {count}')
          path.write_text(text)

          # Context progressive behavior test.
          path = Path('apps/mobile/test/context_section_test.dart')
          text = path.read_text()
          insertion = r'''

          testWidgets('Progressive Context shows one optional layer at a time', (
            tester,
          ) async {
            tester.platformDispatcher.localeTestValue = const Locale('tr', 'TR');
            addTearDown(tester.platformDispatcher.clearLocaleTestValue);

            await tester.pumpWidget(
              ProviderScope(
                overrides: [
                  decisionRepositoryProvider.overrideWithValue(
                    ContextFakeRepository(),
                  ),
                ],
                child: MaterialApp(
                  locale: const Locale('tr', 'TR'),
                  supportedLocales: KefeStrings.supportedLocales,
                  localizationsDelegates: const [
                    KefeStringsDelegate(),
                    GlobalMaterialLocalizations.delegate,
