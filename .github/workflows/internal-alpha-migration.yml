name: Internal Alpha Source Migration

on:
  push:
    branches: [feature/internal-alpha-hardening]
    paths:
      - '.github/workflows/internal-alpha-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/internal-alpha-hardening
          fetch-depth: 0
      - name: Apply deterministic localization migration
        run: |
          git apply --check docs/migrations/internal-alpha-*.patch
          git apply docs/migrations/internal-alpha-*.patch
      - name: Remove one-shot migration assets
        run: |
          rm docs/migrations/internal-alpha-*.patch
          rm .github/workflows/internal-alpha-migration.yml
      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate production copy into localization boundary'
          git push origin HEAD:feature/internal-alpha-hardening
